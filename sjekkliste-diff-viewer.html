<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIBK Sjekkliste API Forskjellsvisning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* DIBK-inspirerte farger */
        --primary: #23639a;
        --primary-dark: #27435f;
        --primary-light: #e6f2ff;
        --secondary: #00a9a5;
        --secondary-dark: #008a87;
        --secondary-light: #e6fffe;
        --success: #06a261;
        --warning: #f7a800;
        --error: #e02e49;
        --grey-50: #f8fafc;
        --grey-100: #f1f5f9;
        --grey-200: #e2e8f0;
        --grey-300: #cbd5e1;
        --grey-400: #94a3b8;
        --grey-500: #64748b;
        --grey-600: #475569;
        --grey-700: #334155;
        --grey-800: #1e293b;
        --grey-900: #0f172a;
        --white: #ffffff;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --radius: 8px;
        --radius-sm: 4px;
        --radius-lg: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
        background: var(--grey-50);
        color: var(--grey-900);
        line-height: 1.6;
        font-size: 14px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        text-align: center;
        margin-bottom: 32px;
        padding: 24px;
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .controls {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .button-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        background: var(--primary);
        color: var(--white);
        border: none;
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-sm);
      }

      button:hover:not(:disabled) {
        background: var(--primary-dark);
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      button:disabled {
        background: var(--grey-300);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      button:focus {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      /* Keyboard focus for the clickable (role="button") headers. */
      [role="button"]:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
      }

      .loading {
        text-align: center;
        padding: 40px 20px;
        font-size: 16px;
        color: var(--grey-500);
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--grey-200);
      }

      .error {
        background: var(--error);
        color: var(--white);
        padding: 16px;
        border-radius: var(--radius);
        margin: 20px 0;
        border: 1px solid var(--error);
        box-shadow: var(--shadow);
      }

      .summary {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .stat-card {
        padding: 16px;
        text-align: center;
        border-radius: var(--radius);
        color: var(--grey-800);
        font-weight: 600;
        box-shadow: var(--shadow);
        background: var(--white);
        border: 2px solid;
      }

      .stat-identical {
        border-color: var(--success);
        background: linear-gradient(
          135deg,
          rgba(6, 162, 97, 0.1),
          rgba(6, 162, 97, 0.05)
        );
        color: var(--success);
      }
      .stat-different {
        border-color: var(--error);
        background: linear-gradient(
          135deg,
          rgba(224, 46, 73, 0.1),
          rgba(224, 46, 73, 0.05)
        );
        color: var(--error);
      }
      .stat-prod-only {
        border-color: var(--warning);
        background: linear-gradient(
          135deg,
          rgba(247, 168, 0, 0.1),
          rgba(247, 168, 0, 0.05)
        );
        color: #b8860b;
      }
      .stat-test-only {
        border-color: #8b5cf6;
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.1),
          rgba(139, 92, 246, 0.05)
        );
        color: #8b5cf6;
      }

      .category-group {
        background: var(--white);
        margin-bottom: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
        overflow: hidden;
      }

      .category-header {
        background: var(--primary);
        color: var(--white);
        padding: 16px 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s ease;
      }

      .category-header:hover {
        background: var(--primary-dark);
      }

      .category-stats {
        display: flex;
        gap: 15px;
        font-size: 12px;
        font-weight: normal;
        align-items: center;
      }

      .stat-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 12px;
        border-radius: var(--radius-lg);
        font-size: 12px;
        font-weight: 500;
      }

      .stat-badge.has-issues {
        background: var(--error);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
        }
      }

      .category-content {
        display: none;
      }

      .category-content.expanded {
        display: block;
      }

      /* Tema sub-group (a subgroup of Prosesskategori). */
      .theme-group {
        border-top: 1px solid var(--grey-200);
      }

      .theme-group:first-child {
        border-top: none;
      }

      .theme-header {
        background: var(--grey-100);
        color: var(--grey-800);
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-left: 4px solid var(--secondary);
        transition: background-color 0.2s;
      }

      .theme-header:hover {
        background: var(--grey-200);
      }

      .theme-stats {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: normal;
      }

      .theme-header .theme-expand-icon {
        transition: transform 0.3s;
        font-size: 11px;
        margin-left: 10px;
      }

      .theme-header.expanded .theme-expand-icon {
        transform: rotate(90deg);
      }

      .theme-content {
        display: none;
      }

      .theme-content.expanded {
        display: block;
      }

      .item-row {
        padding: 0;
        border-bottom: 1px solid var(--grey-200);
        overflow: hidden;
        transition: all 0.2s ease;
      }

      .item-row:last-child {
        border-bottom: none;
      }

      .item-row:hover {
        background: var(--grey-50);
      }

      .item-details {
        display: none;
        padding: 15px 20px;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .item-details.expanded {
        display: grid;
      }

      .item-header {
        padding: 12px 20px;
        border-radius: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        margin-bottom: 0;
        transition: background-color 0.2s;
      }

      .item-header:hover {
        opacity: 0.9;
      }

      .item-header.expanded {
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .item-expand-icon {
        transition: transform 0.3s;
        font-size: 12px;
        margin-left: 10px;
      }

      .item-header.expanded .item-expand-icon {
        transform: rotate(90deg);
      }

      .item-status-badge {
        padding: 6px 12px;
        border-radius: var(--radius-lg);
        font-size: 12px;
        font-weight: 600;
        color: var(--white);
      }

      .status-identical {
        background: var(--success);
      }
      .status-different {
        background: var(--error);
      }
      .status-prod-only {
        background: var(--warning);
      }
      .status-test-only {
        background: #8b5cf6;
      }

      .item-row[data-status="identical"] .item-header {
        background: rgba(6, 162, 97, 0.04);
        border-left: 3px solid rgba(6, 162, 97, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="different"] .item-header {
        background: rgba(224, 46, 73, 0.04);
        border-left: 3px solid rgba(224, 46, 73, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="prodOnly"] .item-header {
        background: rgba(247, 168, 0, 0.04);
        border-left: 3px solid rgba(247, 168, 0, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="testOnly"] .item-header {
        background: rgba(139, 92, 246, 0.04);
        border-left: 3px solid rgba(139, 92, 246, 0.4);
        color: var(--grey-900);
      }

      .env-column {
        padding: 15px;
        border-radius: 6px;
        position: relative;
      }

      .env-prod {
        background: #ecf0f1;
        border-left: 4px solid #3498db;
      }

      .env-test {
        background: #f8f9fa;
        border-left: 4px solid #2ecc71;
      }

      .env-title {
        font-weight: bold;
        margin-bottom: 10px;
        color: #2c3e50;
      }

      .field-diff {
        margin: 8px 0;
        padding: 8px;
        border-radius: 4px;
      }

      .field-same {
        background: #d5f4e6;
        border-left: 3px solid #27ae60;
      }

      .field-different {
        background: #fadbd8;
        border-left: 3px solid #e74c3c;
      }

      .field-missing {
        background: #fdebd0;
        border-left: 3px solid #f39c12;
      }

      .field-extra {
        background: #a29bfe;
        border-left: 3px solid #6c5ce7;
      }

      .field-name {
        font-weight: bold;
        color: #2d3436;
      }

      .field-value {
        color: #636e72;
        font-family: "Courier New", monospace;
        font-size: 12px;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* On the prod side: tokens that test is missing (prod is the source of truth). */
      .diff-prod-only {
        background: #fff3bf;
        color: #7a5b00;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #f7a800;
      }

      /* On the test side: tokens that deviate from prod. */
      .diff-test-only {
        background: #f8b4b4;
        color: #7a1f1f;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #e02e49;
      }

      /* A sub-checkpoint that exists on both sides but has changed. */
      .diff-changed {
        background: #ffe8cc;
        color: #7a3d00;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #f97316;
      }

      .diff-summary {
        font-family: "Inter", sans-serif;
        font-size: 11px;
        color: var(--grey-600);
        margin-bottom: 6px;
        font-weight: 500;
      }

      .diff-summary strong {
        color: var(--error);
      }

      .expand-icon {
        transition: transform 0.3s;
      }

      .expanded .expand-icon {
        transform: rotate(90deg);
      }

      .filters {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .filter-group label {
        font-weight: 600;
        font-size: 14px;
        color: var(--grey-700);
      }

      .filter-group select,
      .filter-group input {
        padding: 10px 12px;
        border: 1px solid var(--grey-300);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--white);
        transition: all 0.2s ease;
      }

      .filter-group select:focus,
      .filter-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 98, 186, 0.1);
      }

      .filter-group.active select,
      .filter-group.active input {
        border-color: var(--success);
        background-color: var(--grey-50);
      }

      .filter-group.active label {
        color: var(--success);
        font-weight: 700;
      }

      select,
      input {
        padding: 10px 12px;
        border: 1px solid var(--grey-300);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--white);
      }

      .legend {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
        padding: 16px;
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--grey-200);
        box-shadow: var(--shadow-sm);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
        color: var(--grey-700);
      }

      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-sm);
      }

      @media (max-width: 768px) {
        .item-row {
          grid-template-columns: 1fr;
        }

        .button-group {
          flex-direction: column;
        }

        .filters {
          flex-direction: column;
        }
      }

      .search-section {
        background: var(--primary-light);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--primary);
        box-shadow: var(--shadow);
      }

      .search-section .filter-group input {
        border: 2px solid var(--primary) !important;
        background: var(--white);
        font-size: 16px;
        padding: 14px;
      }

      .search-section .filter-group input:focus {
        border-color: var(--primary-dark) !important;
        box-shadow: 0 0 0 3px rgba(0, 98, 186, 0.1);
        outline: none;
      }

      .view-controls {
        background: var(--grey-100);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--grey-300);
        box-shadow: var(--shadow-sm);
      }

      .filters {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      /* Main items get a left accent to anchor the hierarchy. */
      .item-row {
        border-left: 4px solid var(--primary);
      }

      .subcheckpoints-section {
        display: none;
        background: #eef3f9;
        border-top: 1px solid var(--grey-300);
        padding: 0 0 0 36px;
        position: relative;
      }

      .item-header.expanded ~ .subcheckpoints-section {
        display: block;
      }

      .subcheckpoint-header.expanded ~ .subcheckpoints-section {
        display: block;
      }

      .subcheckpoints-section::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--primary);
        opacity: 0.4;
      }

      .subcheckpoints-section-title {
        padding: 10px 20px;
        background: var(--primary-dark);
        color: var(--white);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        margin-left: -36px;
        padding-left: 36px;
      }

      .subcheckpoint-row {
        border-bottom: 1px solid var(--grey-200);
        background: var(--white);
        margin: 6px 12px 6px 0;
        border-radius: var(--radius-sm);
        border-left: 3px solid var(--grey-300);
        box-shadow: var(--shadow-sm);
      }

      .subcheckpoint-row:last-child {
        border-bottom: 1px solid var(--grey-200);
      }

      .subcheckpoint-header {
        padding: 10px 16px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        transition: background-color 0.2s;
      }

      .subcheckpoint-header:hover {
        background: var(--grey-100);
      }

      .subcheckpoint-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--secondary-light);
        color: var(--secondary-dark);
        border: 1px solid var(--secondary);
        padding: 2px 8px;
        border-radius: var(--radius-lg);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-right: 8px;
      }

      .main-label {
        display: inline-flex;
        align-items: center;
        background: var(--primary);
        color: var(--white);
        padding: 3px 10px;
        border-radius: var(--radius-lg);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 10px;
      }

      .subcheckpoint-id {
        font-weight: 700;
        color: var(--grey-800);
      }

      .subcheckpoint-header .item-expand-icon {
        transition: transform 0.3s;
        font-size: 11px;
        margin-left: 10px;
      }

      .subcheckpoint-header.expanded .item-expand-icon {
        transform: rotate(90deg);
      }

      .subcheckpoint-details {
        display: none;
        padding: 12px 16px 14px 16px;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        background: var(--grey-50);
        border-top: 1px dashed var(--grey-300);
      }

      .subcheckpoint-details.expanded {
        display: grid;
      }

      .subcheckpoint-row[data-status="identical"] {
        border-left-color: var(--success);
      }
      .subcheckpoint-row[data-status="different"] {
        border-left-color: var(--error);
      }
      .subcheckpoint-row[data-status="prodOnly"] {
        border-left-color: var(--warning);
      }
      .subcheckpoint-row[data-status="testOnly"] {
        border-left-color: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DIBK Sjekkliste API Forskjellsvisning</h1>

      <div class="controls">
        <div
          class="env-selector"
          style="
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 20px;
            background: var(--primary-light);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
          "
        >
          <div class="filter-group" id="leftEnvGroup" style="margin: 0">
            <label for="leftEnv">Sammenlign (fasit):</label>
            <select id="leftEnv">
              <option value="prod" selected>Prod</option>
              <option value="test">Test</option>
              <option value="dev">Dev</option>
            </select>
          </div>
          <span style="padding-bottom: 10px; font-weight: 600; color: var(--primary-dark)"
            >mot</span
          >
          <div class="filter-group" id="rightEnvGroup" style="margin: 0">
            <label for="rightEnv">Miljø:</label>
            <select id="rightEnv">
              <option value="prod">Prod</option>
              <option value="test" selected>Test</option>
              <option value="dev">Dev</option>
            </select>
          </div>
        </div>

        <div class="button-group">
          <button id="loadData">Last inn data</button>
          <button id="expandAll" disabled>Utvid alle</button>
          <button id="collapseAll" disabled>Kollaps alle</button>
          <button id="exportDiff" disabled>Eksporter forskjeller</button>
        </div>

        <div
          class="search-section"
          style="
            margin-top: 15px;
            background: var(--primary-light);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--primary);
            box-shadow: var(--shadow);
          "
        >
          <div class="filter-group" id="searchFilterGroup" style="margin: 0">
            <label
              for="searchFilter"
              style="font-size: 16px; font-weight: 700; color: var(--primary)"
              >🔍 Søk etter ID eller navn:</label
            >
            <input
              type="text"
              id="searchFilter"
              placeholder="Skriv ID eller navn for å søke..."
              style="margin-top: 8px; font-size: 16px; padding: 14px"
            />
          </div>
        </div>

        <div
          class="view-controls"
          style="
            margin-top: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #6c757d;
          "
        >
          <h4 style="margin: 0 0 10px 0; color: #495057; font-size: 14px">
            ⚙️ Visningsinnstillinger
          </h4>
          <div
            class="filter-group"
            id="groupByTemaGroup"
            style="margin: 0 0 12px 0"
          >
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
              "
            >
              <input
                type="checkbox"
                id="groupByTemaToggle"
                style="width: auto"
              />
              Grupper etter tema
            </label>
          </div>
          <div
            class="filter-group"
            id="expandModeFilterGroup"
            style="margin: 0"
          >
            <label for="expandModeFilter">Vis detaljer:</label>
            <select id="expandModeFilter">
              <option value="collapsed">Kun overskrifter</option>
              <option value="expanded">Vis alle detaljer</option>
              <option value="issues-only">Kun problem-detaljer</option>
            </select>
          </div>
        </div>

        <div class="filters" style="margin-top: 15px; display: none">
          <h4 style="margin: 0 0 15px 0; color: #2c3e50; font-size: 16px">
            🎯 Filter innhold
          </h4>

          <div class="filter-group" id="categoryFilterGroup">
            <label for="categoryFilter">Kategori:</label>
            <select id="categoryFilter">
              <option value="">Alle kategorier</option>
            </select>
          </div>

          <div class="filter-group" id="statusFilterGroup">
            <label for="statusFilter">Vis bare:</label>
            <select id="statusFilter">
              <option value="">Alle elementer</option>
              <option value="issues">
                Kun problemer (forskjeller + manglende)
              </option>
              <option value="different">Kun forskjellige verdier</option>
              <option value="identical">Kun identiske</option>
              <option value="prodOnly" id="statusOptProdOnly">
                Kun finnes i prod
              </option>
              <option value="testOnly" id="statusOptTestOnly">
                Kun finnes i test
              </option>
            </select>
          </div>

          <div class="filter-group" id="fieldDifferenceFilterGroup">
            <label for="fieldDifferenceFilter">Felt med endringer:</label>
            <select id="fieldDifferenceFilter">
              <option value="">Alle felt</option>
            </select>
          </div>

          <div class="active-filters" id="activeFiltersDisplay">
            <h4>Aktive filter:</h4>
            <div id="activeFilterTags"></div>
            <button class="clear-filters" onclick="clearAllFilters()">
              Fjern alle filter
            </button>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(6, 162, 97, 0.06);
                border: 1px solid rgba(6, 162, 97, 0.3);
              "
            ></div>
            <span>Identisk</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(224, 46, 73, 0.06);
                border: 1px solid rgba(224, 46, 73, 0.3);
              "
            ></div>
            <span>Forskjellig</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(247, 168, 0, 0.06);
                border: 1px solid rgba(247, 168, 0, 0.3);
              "
            ></div>
            <span id="legendMissing">Mangler i test</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(139, 92, 246, 0.06);
                border: 1px solid rgba(139, 92, 246, 0.3);
              "
            ></div>
            <span id="legendExtra">Finnes bare i test</span>
          </div>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none">
        Laster data fra begge endepunkter...
      </div>

      <div id="error" class="error" style="display: none"></div>

      <div id="summary" class="summary" style="display: none">
        <h2>Sammendrag</h2>
        <div class="summary-stats">
          <div class="stat-card stat-identical">
            <h3 id="identicalCount">0</h3>
            <p>Identiske elementer</p>
          </div>
          <div class="stat-card stat-different">
            <h3 id="differentCount">0</h3>
            <p>Forskjellige elementer</p>
          </div>
          <div class="stat-card stat-prod-only">
            <h3 id="prodOnlyCount">0</h3>
            <p id="prodOnlyLabel">Kun i prod</p>
          </div>
          <div class="stat-card stat-test-only">
            <h3 id="testOnlyCount">0</h3>
            <p id="testOnlyLabel">Kun i test</p>
          </div>
        </div>
      </div>

      <div id="results"></div>
    </div>

    <script>
      // Available environments. The "left" environment acts as the source of
      // truth (fasit); the "right" environment is compared against it.
      const ENVIRONMENTS = {
        prod: {
          label: "Prod",
          url: "https://sjekkliste-bygg-api.ft.dibk.no/api/sjekkliste",
        },
        test: {
          label: "Test",
          url: "https://sjekkliste-bygg-api.ft-test.dibk.no/api/sjekkliste",
        },
        dev: {
          label: "Dev",
          url: "https://sjekkliste-bygg-api.ft-dev.dibk.no/api/sjekkliste",
        },
      };

      // Currently selected environments (left = source of truth, right = compared).
      let leftEnv = "prod";
      let rightEnv = "test";

      const leftLabel = () => ENVIRONMENTS[leftEnv].label;
      const rightLabel = () => ENVIRONMENTS[rightEnv].label;

      let prodData = null;
      let testData = null;
      let comparisonData = null;

      // Whether to sub-group each category's items by Tema.
      let groupByTema = false;

      // Event listeners
      document.getElementById("loadData").addEventListener("click", loadData);
      document
        .getElementById("expandAll")
        .addEventListener("click", () => toggleAllCategories(true));
      document
        .getElementById("collapseAll")
        .addEventListener("click", () => toggleAllCategories(false));
      document
        .getElementById("exportDiff")
        .addEventListener("click", exportDifferences);
      document
        .getElementById("categoryFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("statusFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("searchFilter")
        .addEventListener("input", applyFilters);
      document
        .getElementById("fieldDifferenceFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("expandModeFilter")
        .addEventListener("change", applyExpandMode);
      document
        .getElementById("groupByTemaToggle")
        .addEventListener("change", onGroupByTemaChange);
      document
        .getElementById("leftEnv")
        .addEventListener("change", () => onEnvChange("leftEnv"));
      document
        .getElementById("rightEnv")
        .addEventListener("change", () => onEnvChange("rightEnv"));

      // Keep the two environment selectors from pointing at the same environment.
      function onEnvChange(changedId) {
        const left = document.getElementById("leftEnv");
        const right = document.getElementById("rightEnv");

        if (left.value === right.value) {
          const other = changedId === "leftEnv" ? right : left;
          const keepValue = changedId === "leftEnv" ? left.value : right.value;
          other.value = Object.keys(ENVIRONMENTS).find((k) => k !== keepValue);
        }

        leftEnv = left.value;
        rightEnv = right.value;
        updateEnvLabels();
        syncState();
      }

      // Update every user-facing label that references an environment.
      function updateEnvLabels() {
        document.getElementById("prodOnlyLabel").textContent =
          `Kun i ${leftLabel()}`;
        document.getElementById("testOnlyLabel").textContent =
          `Kun i ${rightLabel()}`;
        document.getElementById("legendMissing").textContent =
          `Mangler i ${rightLabel()}`;
        document.getElementById("legendExtra").textContent =
          `Finnes bare i ${rightLabel()}`;
        document.getElementById("statusOptProdOnly").textContent =
          `Kun finnes i ${leftLabel()}`;
        document.getElementById("statusOptTestOnly").textContent =
          `Kun finnes i ${rightLabel()}`;
      }

      // ---- Persisted / shareable state (URL query + localStorage) ----
      const STORAGE_KEY = "sjekklisteViewerState";

      function currentState() {
        return {
          left: document.getElementById("leftEnv").value,
          right: document.getElementById("rightEnv").value,
          group: document.getElementById("groupByTemaToggle").checked
            ? "1"
            : "0",
          expand: document.getElementById("expandModeFilter").value,
          q: document.getElementById("searchFilter").value,
          status: document.getElementById("statusFilter").value,
        };
      }

      // Reflect the current view in the URL (for shareable links) and
      // localStorage (for returning visits).
      function syncState() {
        const s = currentState();
        const params = new URLSearchParams();
        params.set("left", s.left);
        params.set("right", s.right);
        if (s.group === "1") params.set("group", "1");
        if (s.expand && s.expand !== "collapsed") params.set("expand", s.expand);
        if (s.q) params.set("q", s.q);
        if (s.status) params.set("status", s.status);
        const query = params.toString();
        history.replaceState(
          null,
          "",
          query ? `${location.pathname}?${query}` : location.pathname,
        );
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
        } catch (e) {
          /* storage may be unavailable (private mode) */
        }
      }

      // Restore from the URL if present, otherwise from localStorage.
      function restoreState() {
        const params = new URLSearchParams(location.search);
        let s = {};
        if ([...params.keys()].length) {
          s = {
            left: params.get("left"),
            right: params.get("right"),
            group: params.get("group"),
            expand: params.get("expand"),
            q: params.get("q"),
            status: params.get("status"),
          };
        } else {
          try {
            s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          } catch (e) {
            s = {};
          }
        }

        const setSelect = (id, val) => {
          if (val == null) return;
          const el = document.getElementById(id);
          if ([...el.options].some((o) => o.value === val)) el.value = val;
        };
        setSelect("leftEnv", s.left);
        setSelect("rightEnv", s.right);
        if (s.group != null) {
          const on = s.group === "1" || s.group === true;
          document.getElementById("groupByTemaToggle").checked = on;
          groupByTema = on;
        }
        setSelect("expandModeFilter", s.expand);
        if (s.q != null) document.getElementById("searchFilter").value = s.q;
        setSelect("statusFilter", s.status);

        leftEnv = document.getElementById("leftEnv").value;
        rightEnv = document.getElementById("rightEnv").value;
        updateEnvLabels();
      }

      restoreState();

      async function loadData() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const loadButton = document.getElementById("loadData");

        // Read the current environment selection.
        leftEnv = document.getElementById("leftEnv").value;
        rightEnv = document.getElementById("rightEnv").value;
        updateEnvLabels();

        loading.textContent = `Laster data fra ${leftLabel()} og ${rightLabel()}...`;
        loading.style.display = "block";
        error.style.display = "none";
        loadButton.disabled = true;

        try {
          // Load data from both selected endpoints
          const [prodResponse, testResponse] = await Promise.all([
            fetch(ENVIRONMENTS[leftEnv].url, {
              method: "GET",
              mode: "cors",
              headers: {
                Accept: "application/json",
              },
            }),
            fetch(ENVIRONMENTS[rightEnv].url, {
              method: "GET",
              mode: "cors",
              headers: {
                Accept: "application/json",
              },
            }),
          ]);

          if (!prodResponse.ok) {
            throw new Error(
              `${leftLabel()} API feil: ${prodResponse.status} ${prodResponse.statusText}`,
            );
          }
          if (!testResponse.ok) {
            throw new Error(
              `${rightLabel()} API feil: ${testResponse.status} ${testResponse.statusText}`,
            );
          }

          prodData = await prodResponse.json();
          testData = await testResponse.json();

          console.log("Prod data:", prodData);
          console.log("Test data:", testData);

          // Compare the data
          comparisonData = compareData(prodData, testData);

          // Display results
          displayResults(comparisonData);

          // Enable controls
          document.getElementById("expandAll").disabled = false;
          document.getElementById("collapseAll").disabled = false;
          document.getElementById("exportDiff").disabled = false;
          document.querySelector(".filters").style.display = "flex";

          // Honor any restored/active expand mode and filters.
          applyExpandMode();
          applyFilters();
        } catch (err) {
          console.error("Error loading data:", err);
          // A blocked cross-origin request (or an unreachable environment)
          // throws a bare TypeError with no useful text — the most likely
          // failure when hosting the tool on a different origin than the API.
          if (err instanceof TypeError) {
            error.textContent =
              `Klarte ikke å hente data fra ${leftLabel()}/${rightLabel()}. ` +
              `Trolig CORS eller nettverk: sjekk at API-et tillater origin ` +
              `${location.origin}, og at du har tilgang til det valgte miljøet. ` +
              `(Teknisk: ${err.message || "Failed to fetch"})`;
          } else {
            error.textContent = `Feil ved lasting av data: ${err.message}`;
          }
          error.style.display = "block";
        } finally {
          loading.style.display = "none";
          loadButton.disabled = false;
        }
      }

      // Re-render the category list when the Tema-grouping toggle changes,
      // preserving the active filters and expand mode.
      function onGroupByTemaChange() {
        groupByTema = document.getElementById("groupByTemaToggle").checked;
        if (!comparisonData) return;
        const resultsContainer = document.getElementById("results");
        resultsContainer.innerHTML = "";
        Object.keys(comparisonData.categories)
          .sort()
          .forEach((category) => {
            resultsContainer.appendChild(
              createCategoryElement(
                category,
                comparisonData.categories[category],
              ),
            );
          });
        applyExpandMode();
        applyFilters();
      }

      function compareData(prodData, testData) {
        // Group data by Prosesskategori
        const prodByCategory = groupByCategory(prodData);
        const testByCategory = groupByCategory(testData);

        const result = {
          categories: {},
          summary: {
            identical: 0,
            different: 0,
            prodOnly: 0,
            testOnly: 0,
          },
        };

        // Get all unique categories
        const allCategories = new Set([
          ...Object.keys(prodByCategory),
          ...Object.keys(testByCategory),
        ]);

        allCategories.forEach((category) => {
          const prodItems = prodByCategory[category] || [];
          const testItems = testByCategory[category] || [];

          result.categories[category] = compareCategory(prodItems, testItems);

          // Update summary
          Object.values(result.categories[category].items).forEach((item) => {
            result.summary[item.status]++;
          });
        });

        return result;
      }

      function groupByCategory(data) {
        const grouped = {};

        if (Array.isArray(data)) {
          data.forEach((item) => {
            const category = item.Prosesskategori || "Ukjent kategori";
            if (!grouped[category]) {
              grouped[category] = [];
            }
            grouped[category].push(item);
          });
        }

        return grouped;
      }

      function compareCategory(prodItems, testItems) {
        const result = {
          items: {},
          stats: { identical: 0, different: 0, prodOnly: 0, testOnly: 0 },
        };

        // Create lookup maps by Id
        const prodMap = {};
        const testMap = {};

        prodItems.forEach((item) => {
          const id = item.Id || "unknown";
          prodMap[id] = item;
        });

        testItems.forEach((item) => {
          const id = item.Id || "unknown";
          testMap[id] = item;
        });

        // Get all unique IDs
        const allIds = new Set([
          ...Object.keys(prodMap),
          ...Object.keys(testMap),
        ]);

        allIds.forEach((id) => {
          const prodItem = prodMap[id];
          const testItem = testMap[id];

          if (prodItem && testItem) {
            // Item exists in both
            const comparison = compareItems(prodItem, testItem);
            result.items[id] = {
              id: id,
              status: comparison.identical ? "identical" : "different",
              prodItem: prodItem,
              testItem: testItem,
              differences: comparison.differences,
            };
            result.stats[comparison.identical ? "identical" : "different"]++;
          } else if (prodItem && !testItem) {
            // Only in prod
            result.items[id] = {
              id: id,
              status: "prodOnly",
              prodItem: prodItem,
              testItem: null,
              differences: [],
            };
            result.stats.prodOnly++;
          } else if (!prodItem && testItem) {
            // Only in test
            result.items[id] = {
              id: id,
              status: "testOnly",
              prodItem: null,
              testItem: testItem,
              differences: [],
            };
            result.stats.testOnly++;
          }
        });

        return result;
      }

      function compareItems(prodItem, testItem) {
        const differences = [];
        let identical = true;

        // Fields to ignore in comparison (timestamps, per-env keys, etc.)
        const fieldsToIgnore = [
          "SjekkId",
          "Oppdatert",
          "Updated",
          "LastModified",
          "Timestamp",
        ];

        // Get all unique keys, excluding fields to ignore
        const allKeys = new Set([
          ...Object.keys(prodItem || {}),
          ...Object.keys(testItem || {}),
        ]);

        // Filter out ignored fields
        const keysToCompare = Array.from(allKeys).filter(
          (key) => !fieldsToIgnore.includes(key),
        );

        keysToCompare.forEach((key) => {
          const prodValue = prodItem ? prodItem[key] : undefined;
          const testValue = testItem ? testItem[key] : undefined;

          // Special handling for Undersjekkpunkter - deep compare each subcheckpoint by Id
          if (key === "Undersjekkpunkter") {
            if (prodValue === undefined && testValue === undefined) {
              return;
            }
            if (prodValue === undefined && testValue !== undefined) {
              differences.push({
                field: key,
                type: "missing_in_prod",
                prodValue: undefined,
                testValue: testValue,
              });
              identical = false;
              return;
            }
            if (prodValue !== undefined && testValue === undefined) {
              differences.push({
                field: key,
                type: "missing_in_test",
                prodValue: prodValue,
                testValue: undefined,
              });
              identical = false;
              return;
            }

            const subResult = compareSubcheckpoints(prodValue, testValue);
            const subIdentical =
              subResult.stats.different === 0 &&
              subResult.stats.prodOnly === 0 &&
              subResult.stats.testOnly === 0;

            differences.push({
              field: key,
              type: subIdentical ? "same" : "different",
              prodValue: prodValue,
              testValue: testValue,
              subResult: subResult,
            });

            if (!subIdentical) identical = false;
            return;
          }

          if (prodValue === undefined && testValue !== undefined) {
            differences.push({
              field: key,
              type: "missing_in_prod",
              prodValue: undefined,
              testValue: testValue,
            });
            identical = false;
          } else if (prodValue !== undefined && testValue === undefined) {
            differences.push({
              field: key,
              type: "missing_in_test",
              prodValue: prodValue,
              testValue: undefined,
            });
            identical = false;
          } else if (!deepEqual(prodValue, testValue)) {
            differences.push({
              field: key,
              type: "different",
              prodValue: prodValue,
              testValue: testValue,
            });
            identical = false;
          } else {
            differences.push({
              field: key,
              type: "same",
              prodValue: prodValue,
              testValue: testValue,
            });
          }
        });

        return { identical, differences };
      }

      function compareSubcheckpoints(prodArray, testArray) {
        const result = {
          subItems: {},
          stats: { identical: 0, different: 0, prodOnly: 0, testOnly: 0 },
        };

        const prodMap = {};
        const testMap = {};

        if (Array.isArray(prodArray)) {
          prodArray.forEach((item, idx) => {
            const id =
              item && item.Id !== undefined && item.Id !== null
                ? item.Id
                : `__idx_${idx}`;
            prodMap[id] = item;
          });
        }
        if (Array.isArray(testArray)) {
          testArray.forEach((item, idx) => {
            const id =
              item && item.Id !== undefined && item.Id !== null
                ? item.Id
                : `__idx_${idx}`;
            testMap[id] = item;
          });
        }

        const allIds = new Set([
          ...Object.keys(prodMap),
          ...Object.keys(testMap),
        ]);

        allIds.forEach((id) => {
          const prodItem = prodMap[id];
          const testItem = testMap[id];

          if (prodItem && testItem) {
            const comparison = compareItems(prodItem, testItem);
            result.subItems[id] = {
              id: id,
              status: comparison.identical ? "identical" : "different",
              prodItem: prodItem,
              testItem: testItem,
              differences: comparison.differences,
            };
            result.stats[comparison.identical ? "identical" : "different"]++;
          } else if (prodItem) {
            result.subItems[id] = {
              id: id,
              status: "prodOnly",
              prodItem: prodItem,
              testItem: null,
              differences: [],
            };
            result.stats.prodOnly++;
          } else if (testItem) {
            result.subItems[id] = {
              id: id,
              status: "testOnly",
              prodItem: null,
              testItem: testItem,
              differences: [],
            };
            result.stats.testOnly++;
          }
        });

        return result;
      }

      function deepEqual(a, b) {
        if (a === b) return true;

        if (a == null || b == null) return false;

        if (typeof a !== typeof b) return false;

        if (typeof a === "object") {
          if (Array.isArray(a) !== Array.isArray(b)) return false;

          const keysA = Object.keys(a);
          const keysB = Object.keys(b);

          if (keysA.length !== keysB.length) return false;

          for (let key of keysA) {
            if (!keysB.includes(key)) return false;
            if (!deepEqual(a[key], b[key])) return false;
          }

          return true;
        }

        return false;
      }

      function displayResults(comparisonData) {
        // Update summary
        updateSummary(comparisonData.summary);

        // Update category filter
        updateCategoryFilter(Object.keys(comparisonData.categories));

        // Update field difference filter
        updateFieldDifferenceFilter(comparisonData.categories);

        // Initialize filter visual states
        updateFilterVisualStates();

        // Display comparison results
        const resultsContainer = document.getElementById("results");
        resultsContainer.innerHTML = "";

        Object.keys(comparisonData.categories)
          .sort()
          .forEach((category) => {
            const categoryData = comparisonData.categories[category];
            const categoryElement = createCategoryElement(
              category,
              categoryData,
            );
            resultsContainer.appendChild(categoryElement);
          });

        document.getElementById("summary").style.display = "block";
      }

      function updateSummary(summary) {
        document.getElementById("identicalCount").textContent =
          summary.identical;
        document.getElementById("differentCount").textContent =
          summary.different;
        document.getElementById("prodOnlyCount").textContent = summary.prodOnly;
        document.getElementById("testOnlyCount").textContent = summary.testOnly;
      }

      function updateCategoryFilter(categories) {
        const select = document.getElementById("categoryFilter");
        select.innerHTML = '<option value="">Alle kategorier</option>';

        categories.sort().forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          select.appendChild(option);
        });
      }

      function updateFieldDifferenceFilter(categoriesData) {
        const select = document.getElementById("fieldDifferenceFilter");
        select.innerHTML = '<option value="">Alle felt</option>';

        const allFieldsWithDifferences = new Set();

        // Samle alle felt som har forskjeller fra alle kategorier
        Object.values(categoriesData).forEach((categoryData) => {
          Object.values(categoryData.items).forEach((item) => {
            if (item.differences) {
              item.differences
                .filter((diff) => diff.type !== "same")
                .forEach((diff) => {
                  allFieldsWithDifferences.add(diff.field);
                });
            }
          });
        });

        // Legg til felt i dropdown sortert alfabetisk
        [...allFieldsWithDifferences].sort().forEach((field) => {
          const option = document.createElement("option");
          option.value = field;
          option.textContent = field;
          select.appendChild(option);
        });
      }

      // Shared badge markup for a category or Tema group, from item counts.
      // `compact` drops the trailing words for the denser Tema headers.
      function statsBadges(total, stats, compact) {
        const parts = [`<span class="stat-badge">${total} elementer</span>`];
        if (stats.identical > 0)
          parts.push(
            `<span class="stat-badge" style="background: #27ae60;">✓ ${stats.identical}${compact ? "" : " identiske"}</span>`,
          );
        if (stats.different > 0)
          parts.push(
            `<span class="stat-badge has-issues" style="background: #e74c3c;">⚠ ${stats.different}${compact ? "" : " forskjellige"}</span>`,
          );
        if (stats.prodOnly > 0)
          parts.push(
            `<span class="stat-badge has-issues" style="background: #f39c12;">📤 ${stats.prodOnly}${compact ? "" : " kun i " + leftLabel()}</span>`,
          );
        if (stats.testOnly > 0)

          const byTheme = {};
          Object.keys(categoryData.items).forEach((id) => {
            const itemData = categoryData.items[id];

              (itemData.prodItem && itemData.prodItem.Tema) ||
              (itemData.testItem && itemData.testItem.Tema) ||

            (byTheme[tema] = byTheme[tema] || []).push(itemData);

          Object.keys(byTheme)
            .sort()
            .forEach((tema) => {

              content.appendChild(createItemElement(categoryData.items[id]));

      // Resolve the subcheckpoint comparison to render under an item or a
      // sub-item: the array present on one side (prod/test only), or the
      // deep-compared subResult attached to an Undersjekkpunkter difference.
      function getSubResultToShow(data) {
        if (
          data.status === "prodOnly" &&
          data.prodItem &&
          Array.isArray(data.prodItem.Undersjekkpunkter) &&
          data.prodItem.Undersjekkpunkter.length > 0
        ) {
          return compareSubcheckpoints(data.prodItem.Undersjekkpunkter, null);
        }
        if (
          data.status === "testOnly" &&
          data.testItem &&
          Array.isArray(data.testItem.Undersjekkpunkter) &&
          data.testItem.Undersjekkpunkter.length > 0
        ) {
          return compareSubcheckpoints(null, data.testItem.Undersjekkpunkter);
        }
        if (data.differences) {
          const undersjekkDiff = data.differences.find(
            (d) => d.field === "Undersjekkpunkter" && d.subResult,
          );
          if (undersjekkDiff) return undersjekkDiff.subResult;
        }
        return null;
      }

      function createFieldDifference(diff) {
        const prodDiv = document.createElement("div");
        const testDiv = document.createElement("div");

        let className = "field-diff ";
        switch (diff.type) {
          case "same":
            className += "field-same";
            break;
          case "different":
            className += "field-different";
            break;
          case "missing_in_test":
            className += "field-missing";
            break;
          case "missing_in_prod":
            className += "field-extra";
            break;
        }

        prodDiv.className = className;
        testDiv.className = className;

        // Special handling for Undersjekkpunkter
        if (diff.field === "Undersjekkpunkter") {
          const prodName = document.createElement("div");
          prodName.className = "field-name";
          prodName.textContent = diff.field;

          const testName = document.createElement("div");
          testName.className = "field-name";
          testName.textContent = diff.field;

          const prodValue = document.createElement("div");
          prodValue.className = "field-value";

          const testValue = document.createElement("div");
          testValue.className = "field-value";

          let summaryProd = null;
          let summaryTest = null;
          if (diff.type === "different") {
            // Drive the panel from the already-computed subcheckpoint diff so
            // that matched-but-changed sub-items are surfaced, not just
            // presence differences.
            const subItems = (diff.subResult && diff.subResult.subItems) || {};
            const stats = (diff.subResult && diff.subResult.stats) || {
              prodOnly: 0,
              testOnly: 0,
              different: 0,
            };

            // Render one side's ID list, colouring each sub-checkpoint by its
            // comparison status (only-left, only-right, changed, identical).
            const renderSide = (arr, side) => {
              const ids = Array.isArray(arr)
                ? arr
                    .map((x) => x && x.Id)
                    .filter((id) => id !== undefined && id !== null)
                : [];
              const label = `<strong>${ids.length} undersjekkpunkt${ids.length !== 1 ? "er" : ""}:</strong><br>`;
              if (!ids.length) return label + "<em>Ingen</em>";
              const rendered = ids
                .map((id) => {
                  const status = subItems[id] && subItems[id].status;
                  const esc = escapeHtml(id);
                  if (status === "different")
                    return `<span class="diff-changed">${esc}</span>`;
                  if (side === "prod" && status === "prodOnly")
                    return `<span class="diff-prod-only">${esc}</span>`;
                  if (side === "test" && status === "testOnly")
                    return `<span class="diff-test-only">${esc}</span>`;
                  return esc;
                })
                .join(", ");
              return label + rendered;
            };

            const parts = [];
            if (stats.prodOnly)
              parts.push(
                `<strong>${stats.prodOnly}</strong> mangler i ${rightLabel()}`,
              );
            if (stats.testOnly)
              parts.push(
                `<strong>${stats.testOnly}</strong> finnes bare i ${rightLabel()}`,
              );
            if (stats.different)
              parts.push(`<strong>${stats.different}</strong> endret`);
            if (parts.length) {
              summaryProd = document.createElement("div");
              summaryProd.className = "diff-summary";
              summaryProd.innerHTML = `Avvik fra ${leftLabel()}: ${parts.join(", ")}`;
              summaryTest = summaryProd.cloneNode(true);
            }

            prodValue.innerHTML = renderSide(diff.prodValue, "prod");
            testValue.innerHTML = renderSide(diff.testValue, "test");
          } else {
            prodValue.innerHTML = formatUndersjekkpunkter(diff.prodValue);
            testValue.innerHTML = formatUndersjekkpunkter(diff.testValue);
          }

          prodDiv.appendChild(prodName);
          if (summaryProd) prodDiv.appendChild(summaryProd);
          prodDiv.appendChild(prodValue);
          testDiv.appendChild(testName);
          if (summaryTest) testDiv.appendChild(summaryTest);
          testDiv.appendChild(testValue);

          return { prod: prodDiv, test: testDiv };
        }

        // Field name
        const prodName = document.createElement("div");
        prodName.className = "field-name";
        prodName.textContent = diff.field;

        const testName = document.createElement("div");
        testName.className = "field-name";
        testName.textContent = diff.field;

        // Field values
        const prodValue = document.createElement("div");
        prodValue.className = "field-value";

        const testValue = document.createElement("div");
        testValue.className = "field-value";

        let summaryProd = null;
        let summaryTest = null;
        if (diff.type === "different") {
          const inline = inlineDiff(diff.prodValue, diff.testValue);
          prodValue.innerHTML = inline.prodHtml;
          testValue.innerHTML = inline.testHtml;

          summaryProd = document.createElement("div");
          summaryProd.className = "diff-summary";
          summaryProd.innerHTML = `Avvik fra ${leftLabel()}: <strong>${inline.missingInTest}</strong> mangler i ${rightLabel()}, <strong>${inline.deviatesFromProd}</strong> avvik i ${rightLabel()}`;
          summaryTest = summaryProd.cloneNode(true);
        } else {
          prodValue.textContent = formatValue(diff.prodValue);
          testValue.textContent = formatValue(diff.testValue);
        }

        prodDiv.appendChild(prodName);
        if (summaryProd) prodDiv.appendChild(summaryProd);
        prodDiv.appendChild(prodValue);
        testDiv.appendChild(testName);
        if (summaryTest) testDiv.appendChild(summaryTest);
        testDiv.appendChild(testValue);

        return { prod: prodDiv, test: testDiv };
      }

      function formatValue(value) {
        if (value === undefined) return "(mangler)";
        if (value === null) return "(null)";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function tokenize(str) {
        // Split into words, whitespace, and punctuation so the diff stays readable.
        return String(str).match(/\s+|[A-Za-zÆØÅæøå0-9_]+|[^\s\w]/g) || [];
      }

      function lcsDiff(aTokens, bTokens) {
        const m = aTokens.length,
          n = bTokens.length;
        const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            if (aTokens[i - 1] === bTokens[j - 1]) {
              dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
              dp[i][j] =
                dp[i - 1][j] >= dp[i][j - 1] ? dp[i - 1][j] : dp[i][j - 1];
            }
          }
        }
        const ops = [];
        let i = m,
          j = n;
        while (i > 0 && j > 0) {
          if (aTokens[i - 1] === bTokens[j - 1]) {
            ops.unshift({ type: "eq", token: aTokens[i - 1] });
            i--;
            j--;
          } else if (dp[i - 1][j] >= dp[i][j - 1]) {
            ops.unshift({ type: "del", token: aTokens[i - 1] });
            i--;
          } else {
            ops.unshift({ type: "ins", token: bTokens[j - 1] });
            j--;
          }
        }
        while (i > 0) {
          ops.unshift({ type: "del", token: aTokens[i - 1] });
          i--;
        }
        while (j > 0) {
          ops.unshift({ type: "ins", token: bTokens[j - 1] });
          j--;
        }
        return ops;
      }

      function inlineDiff(prodValue, testValue) {
        const prodStr = formatValue(prodValue);
        const testStr = formatValue(testValue);
        const aTokens = tokenize(prodStr);
        const bTokens = tokenize(testStr);
        const ops = lcsDiff(aTokens, bTokens);

        let prodHtml = "";
        let testHtml = "";
        let missingInTest = 0,
          deviatesFromProd = 0;

        ops.forEach((op) => {
          const escaped = escapeHtml(op.token);
          if (op.type === "eq") {
            prodHtml += escaped;
            testHtml += escaped;
          } else if (op.type === "del") {
            // In prod but not in test — test is missing this.
            prodHtml += `<span class="diff-prod-only">${escaped}</span>`;
            if (op.token.trim()) missingInTest++;
          } else if (op.type === "ins") {
            // In test but not in prod — test deviates from prod.
            testHtml += `<span class="diff-test-only">${escaped}</span>`;
            if (op.token.trim()) deviatesFromProd++;
          }
        });

        return { prodHtml, testHtml, missingInTest, deviatesFromProd };
      }

      function formatUndersjekkpunkter(value) {
        if (value === undefined) return "(mangler)";
        if (value === null) return "(null)";
        if (!Array.isArray(value)) return String(value);

        if (value.length === 0) {
          return "Ingen undersjekkpunkter";
        }

        const ids = value
          .map((item) => escapeHtml(item.Id || "Ukjent ID"))
          .join(", ");
        return `<strong>${value.length} undersjekkpunkt${value.length !== 1 ? "er" : ""}:</strong><br>${ids}`;
      }

      function toggleAllCategories(expand) {
        const categories = document.querySelectorAll(".category-group");
        categories.forEach((category) => {
          const content = category.querySelector(".category-content");
          const header = category.querySelector(".category-header");
          const method = expand ? "add" : "remove";

          content.classList[method]("expanded");
          header.classList[method]("expanded");

          category
            .querySelectorAll(".theme-content")
            .forEach((c) => c.classList[method]("expanded"));
          category
            .querySelectorAll(".theme-header")
            .forEach((h) => h.classList[method]("expanded"));

          const items = category.querySelectorAll(".item-row");
          items.forEach((item) => {
            item.querySelector(".item-details").classList[method]("expanded");
            item.querySelector(".item-header").classList[method]("expanded");
          });

          category
            .querySelectorAll(".subcheckpoint-details")
            .forEach((d) => d.classList[method]("expanded"));
          category
            .querySelectorAll(".subcheckpoint-header")
            .forEach((h) => h.classList[method]("expanded"));
        });
      }

      function applyFilters() {
        const categoryFilter = document.getElementById("categoryFilter").value;
        const statusFilter = document.getElementById("statusFilter").value;
        const searchFilter = document
          .getElementById("searchFilter")
          .value.toLowerCase();
        const fieldDifferenceFilter = document.getElementById(
          "fieldDifferenceFilter",
        ).value;

        // Update filter visual states
        updateFilterVisualStates();

        const categories = document.querySelectorAll(".category-group");

        categories.forEach((categoryElement) => {
          const category = categoryElement.dataset.category;
          let showCategory = true;

          // Category filter
          if (categoryFilter && category !== categoryFilter) {
            showCategory = false;
          }

          if (showCategory) {
            const items = categoryElement.querySelectorAll(".item-row");
            let visibleItems = 0;
            const visibleStats = {
              identical: 0,
              different: 0,
              prodOnly: 0,
              testOnly: 0,
            };

            items.forEach((item) => {
              const status = item.dataset.status;
              const id = item.dataset.id.toLowerCase();
              const searchIds = (item.dataset.searchIds || id).split("|");
              const searchNames = item.dataset.searchNames || "";
              const fieldsWithDifferences =
                item.dataset.fieldsWithDifferences || "";
              let showItem = true;

              // Status filter
              if (statusFilter === "issues") {
                showItem =
                  status === "different" ||
                  status === "prodOnly" ||
                  status === "testOnly";
              } else if (statusFilter && status !== statusFilter) {
                showItem = false;
              }

              // Search filter: exact ID match OR substring name match
              if (searchFilter) {
                const exactIdMatch = searchIds.includes(searchFilter);
                const nameMatch = searchNames.includes(searchFilter);
                if (!exactIdMatch && !nameMatch) {
                  showItem = false;
                }
              }

              // Field difference filter
              if (
                fieldDifferenceFilter &&
                !fieldsWithDifferences
                  .split(",")
                  .includes(fieldDifferenceFilter)
              ) {
                showItem = false;
              }

              item.style.display = showItem ? "block" : "none";
              if (showItem) {
                visibleItems++;
                visibleStats[status] = (visibleStats[status] || 0) + 1;
              }

              // Auto-expand when the match is inside a subcheckpoint
              if (showItem && searchFilter) {
                const mainMatches = id === searchFilter;
                const subRows = item.querySelectorAll(".subcheckpoint-row");
                let anySubMatches = false;
                subRows.forEach((sub) => {
                  const subId = (sub.dataset.id || "").toLowerCase();
                  if (subId === searchFilter) {
                    anySubMatches = true;
                    // Expand the match and every ancestor subcheckpoint row so a
                    // deeply nested hit is actually revealed.
                    let node = sub;
                    while (
                      node &&
                      node.classList.contains("subcheckpoint-row")
                    ) {
                      const sh = node.querySelector(
                        ":scope > .subcheckpoint-header",
                      );
                      const sd = node.querySelector(
                        ":scope > .subcheckpoint-details",
                      );
                      if (sh) sh.classList.add("expanded");
                      if (sd) sd.classList.add("expanded");
                      node = node.parentElement
                        ? node.parentElement.closest(".subcheckpoint-row")
                        : null;
                    }
                  }
                });
                if (anySubMatches && !mainMatches) {
                  const itemHeader = item.querySelector(".item-header");
                  const itemDetails = item.querySelector(".item-details");
                  if (itemHeader) itemHeader.classList.add("expanded");
                  if (itemDetails) itemDetails.classList.add("expanded");
                }
              }
            });

            // Hide Tema sub-groups with no visible items; reveal a theme when
            // a search match lands inside it.
            categoryElement.querySelectorAll(".theme-group").forEach((tg) => {
              const visible = Array.from(
                tg.querySelectorAll(".item-row"),
              ).filter((it) => it.style.display !== "none");
              const tstats = {
                identical: 0,
                different: 0,
                prodOnly: 0,
                testOnly: 0,
              };
              visible.forEach((it) => {
                tstats[it.dataset.status] =
                  (tstats[it.dataset.status] || 0) + 1;
              });
              const ts = tg.querySelector(".theme-stats");
              if (ts) ts.innerHTML = statsBadges(visible.length, tstats, true);
              tg.style.display = visible.length ? "block" : "none";
              if (visible.length && searchFilter) {
                const tc = tg.querySelector(".theme-content");
                const th = tg.querySelector(".theme-header");
                if (tc) tc.classList.add("expanded");
                if (th) th.classList.add("expanded");
              }
            });

            // Update category header with visible count
            const leftSide = categoryElement.querySelector(
              ".category-header > div",
            );
            const titleDiv = leftSide.querySelector("div");
            titleDiv.textContent = `${category}`;

            const statsDiv = leftSide.querySelector(".category-stats");
            statsDiv.innerHTML = statsBadges(visibleItems, visibleStats, false);

            // Auto-expand category when search matches inside it
            if (searchFilter && visibleItems > 0) {
              const content =
                categoryElement.querySelector(".category-content");
              const catHeader =
                categoryElement.querySelector(".category-header");
              if (content) content.classList.add("expanded");
              if (catHeader) catHeader.classList.add("expanded");
            }

            // Hide category if no visible items
            if (visibleItems === 0) {
              showCategory = false;
            }
          }

          categoryElement.style.display = showCategory ? "block" : "none";
        });

        syncState();
      }

      function applyExpandMode() {
        const expandMode = document.getElementById("expandModeFilter").value;
        const allItems = document.querySelectorAll(".item-row");

        // Update expand mode visual state
        updateExpandModeVisualState();

        // Keep Tema sub-groups open so item headers stay visible; the expand
        // mode only controls item/subcheckpoint detail visibility.
        document
          .querySelectorAll(".theme-content")
          .forEach((c) => c.classList.add("expanded"));
        document
          .querySelectorAll(".theme-header")
          .forEach((h) => h.classList.add("expanded"));

        allItems.forEach((item) => {
          const details = item.querySelector(".item-details");
          const header = item.querySelector(".item-header");
          const status = item.dataset.status;
          const subDetails = item.querySelectorAll(".subcheckpoint-details");
          const subHeaders = item.querySelectorAll(".subcheckpoint-header");
          const subRows = item.querySelectorAll(".subcheckpoint-row");

          switch (expandMode) {
            case "expanded":
              details.classList.add("expanded");
              header.classList.add("expanded");
              subDetails.forEach((d) => d.classList.add("expanded"));
              subHeaders.forEach((h) => h.classList.add("expanded"));
              break;
            case "collapsed":
              details.classList.remove("expanded");
              header.classList.remove("expanded");
              subDetails.forEach((d) => d.classList.remove("expanded"));
              subHeaders.forEach((h) => h.classList.remove("expanded"));
              break;
            case "issues-only":
              if (
                status === "different" ||
                status === "prodOnly" ||
                status === "testOnly"
              ) {
                details.classList.add("expanded");
                header.classList.add("expanded");
              } else {
                details.classList.remove("expanded");
                header.classList.remove("expanded");
              }
              subRows.forEach((sub) => {
                const subStatus = sub.dataset.status;
                const sd = sub.querySelector(".subcheckpoint-details");
                const sh = sub.querySelector(".subcheckpoint-header");
                if (
                  subStatus === "different" ||
                  subStatus === "prodOnly" ||
                  subStatus === "testOnly"
                ) {
                  sd.classList.add("expanded");
                  sh.classList.add("expanded");
                } else {
                  sd.classList.remove("expanded");
                  sh.classList.remove("expanded");
                }
              });
              break;
          }
        });

        syncState();
      }

      function updateFilterVisualStates() {
        const filters = [
          { id: "categoryFilter", groupId: "categoryFilterGroup" },
          { id: "statusFilter", groupId: "statusFilterGroup" },
          { id: "searchFilter", groupId: "searchFilterGroup" },
          {
            id: "fieldDifferenceFilter",
            groupId: "fieldDifferenceFilterGroup",
          },
        ];

        const activeFilters = [];

        filters.forEach((filter) => {
          const element = document.getElementById(filter.id);
          const group = document.getElementById(filter.groupId);
          const value = element.value.trim();

          if (value) {
            group.classList.add("active");

            // Add to active filters list
            let displayValue = value;
            if (element.tagName === "SELECT") {
              const selectedOption = element.options[element.selectedIndex];
              displayValue = selectedOption.textContent;
            }

            activeFilters.push({
              label: element.previousElementSibling.textContent.replace(
                ":",
                "",
              ),
              value: displayValue,
              filterId: filter.id,
            });
          } else {
            group.classList.remove("active");
          }
        });

        updateActiveFiltersDisplay(activeFilters);
      }

      function updateExpandModeVisualState() {
        const expandModeGroup = document.getElementById(
          "expandModeFilterGroup",
        );
        const expandMode = document.getElementById("expandModeFilter").value;

        if (expandMode === "collapsed") {
          expandModeGroup.classList.remove("active");
        } else {
          expandModeGroup.classList.add("active");
        }
      }

      function updateActiveFiltersDisplay(activeFilters) {
        const display = document.getElementById("activeFiltersDisplay");
        const tagsContainer = document.getElementById("activeFilterTags");

        if (activeFilters.length > 0) {
          display.style.display = "block";

          tagsContainer.innerHTML = "";
          activeFilters.forEach((filter) => {
            const tag = document.createElement("span");
            tag.className = "filter-tag";
            tag.textContent = `${filter.label}: ${filter.value}`;
            tag.title = "Klikk for å fjerne dette filteret";
            tag.onclick = () => clearSingleFilter(filter.filterId);
            tagsContainer.appendChild(tag);
          });
        } else {
          display.style.display = "none";
        }
      }

      function clearSingleFilter(filterId) {
        const element = document.getElementById(filterId);
        if (element.tagName === "INPUT") {
          element.value = "";
        } else {
          element.selectedIndex = 0;
        }
        applyFilters();
      }

      function clearAllFilters() {
        document.getElementById("categoryFilter").selectedIndex = 0;
        document.getElementById("statusFilter").selectedIndex = 0;
        document.getElementById("searchFilter").value = "";
        document.getElementById("fieldDifferenceFilter").selectedIndex = 0;
        document.getElementById("expandModeFilter").selectedIndex = 0;

        applyFilters();
        applyExpandMode();
      }

      function exportDifferences() {
        if (!comparisonData) return;

        const differences = [];

        Object.keys(comparisonData.categories).forEach((category) => {
          const categoryData = comparisonData.categories[category];

          Object.values(categoryData.items).forEach((item) => {
            if (item.status !== "identical") {
              differences.push({
                category: category,
                id: item.id,
                status: item.status,
                differences: item.differences,
              });
            }
          });
        });

        const data = {
          timestamp: new Date().toISOString(),
          summary: comparisonData.summary,
          differences: differences,
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `sjekkliste-api-diff-${new Date().toISOString().split("T")[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
