<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIBK Sjekkliste API Forskjellsvisning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* DIBK-inspirerte farger */
        --primary: #23639a;
        --primary-dark: #27435f;
        --primary-light: #e6f2ff;
        --secondary: #00a9a5;
        --secondary-dark: #008a87;
        --secondary-light: #e6fffe;
        --success: #06a261;
        --warning: #f7a800;
        --error: #e02e49;
        --grey-50: #f8fafc;
        --grey-100: #f1f5f9;
        --grey-200: #e2e8f0;
        --grey-300: #cbd5e1;
        --grey-400: #94a3b8;
        --grey-500: #64748b;
        --grey-600: #475569;
        --grey-700: #334155;
        --grey-800: #1e293b;
        --grey-900: #0f172a;
        --white: #ffffff;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        --shadow-md:
          0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg:
          0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        --radius: 8px;
        --radius-sm: 4px;
        --radius-lg: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
        background: var(--grey-50);
        color: var(--grey-900);
        line-height: 1.6;
        font-size: 14px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 24px;
      }

      h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        text-align: center;
        margin-bottom: 32px;
        padding: 24px;
        background: var(--white);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .controls {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .button-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button {
        background: var(--primary);
        color: var(--white);
        border: none;
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
        box-shadow: var(--shadow-sm);
      }

      button:hover:not(:disabled) {
        background: var(--primary-dark);
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      button:disabled {
        background: var(--grey-300);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      button:focus {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .loading {
        text-align: center;
        padding: 40px 20px;
        font-size: 16px;
        color: var(--grey-500);
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--grey-200);
      }

      .error {
        background: var(--error);
        color: var(--white);
        padding: 16px;
        border-radius: var(--radius);
        margin: 20px 0;
        border: 1px solid var(--error);
        box-shadow: var(--shadow);
      }

      .summary {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        margin-bottom: 24px;
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      .summary-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }

      .stat-card {
        padding: 16px;
        text-align: center;
        border-radius: var(--radius);
        color: var(--grey-800);
        font-weight: 600;
        box-shadow: var(--shadow);
        background: var(--white);
        border: 2px solid;
      }

      .stat-identical {
        border-color: var(--success);
        background: linear-gradient(
          135deg,
          rgba(6, 162, 97, 0.1),
          rgba(6, 162, 97, 0.05)
        );
        color: var(--success);
      }
      .stat-different {
        border-color: var(--error);
        background: linear-gradient(
          135deg,
          rgba(224, 46, 73, 0.1),
          rgba(224, 46, 73, 0.05)
        );
        color: var(--error);
      }
      .stat-prod-only {
        border-color: var(--warning);
        background: linear-gradient(
          135deg,
          rgba(247, 168, 0, 0.1),
          rgba(247, 168, 0, 0.05)
        );
        color: #b8860b;
      }
      .stat-test-only {
        border-color: #8b5cf6;
        background: linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.1),
          rgba(139, 92, 246, 0.05)
        );
        color: #8b5cf6;
      }

      .category-group {
        background: var(--white);
        margin-bottom: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
        overflow: hidden;
      }

      .category-header {
        background: var(--primary);
        color: var(--white);
        padding: 16px 20px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: all 0.2s ease;
      }

      .category-header:hover {
        background: var(--primary-dark);
      }

      .category-stats {
        display: flex;
        gap: 15px;
        font-size: 12px;
        font-weight: normal;
        align-items: center;
      }

      .stat-badge {
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 12px;
        border-radius: var(--radius-lg);
        font-size: 12px;
        font-weight: 500;
      }

      .stat-badge.has-issues {
        background: var(--error);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
        100% {
          opacity: 1;
        }
      }

      .category-content {
        display: none;
      }

      .category-content.expanded {
        display: block;
      }

      .item-row {
        padding: 0;
        border-bottom: 1px solid var(--grey-200);
        overflow: hidden;
        transition: all 0.2s ease;
      }

      .item-row:last-child {
        border-bottom: none;
      }

      .item-row:hover {
        background: var(--grey-50);
      }

      .item-details {
        display: none;
        padding: 15px 20px;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .item-details.expanded {
        display: grid;
      }

      .item-header {
        padding: 12px 20px;
        border-radius: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        margin-bottom: 0;
        transition: background-color 0.2s;
      }

      .item-header:hover {
        opacity: 0.9;
      }

      .item-header.expanded {
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .item-expand-icon {
        transition: transform 0.3s;
        font-size: 12px;
        margin-left: 10px;
      }

      .item-header.expanded .item-expand-icon {
        transform: rotate(90deg);
      }

      .item-status-badge {
        padding: 6px 12px;
        border-radius: var(--radius-lg);
        font-size: 12px;
        font-weight: 600;
        color: var(--white);
      }

      .status-identical {
        background: var(--success);
      }
      .status-different {
        background: var(--error);
      }
      .status-prod-only {
        background: var(--warning);
      }
      .status-test-only {
        background: #8b5cf6;
      }

      .item-row[data-status="identical"] .item-header {
        background: rgba(6, 162, 97, 0.04);
        border-left: 3px solid rgba(6, 162, 97, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="different"] .item-header {
        background: rgba(224, 46, 73, 0.04);
        border-left: 3px solid rgba(224, 46, 73, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="prodOnly"] .item-header {
        background: rgba(247, 168, 0, 0.04);
        border-left: 3px solid rgba(247, 168, 0, 0.4);
        color: var(--grey-900);
      }

      .item-row[data-status="testOnly"] .item-header {
        background: rgba(139, 92, 246, 0.04);
        border-left: 3px solid rgba(139, 92, 246, 0.4);
        color: var(--grey-900);
      }

      .env-column {
        padding: 15px;
        border-radius: 6px;
        position: relative;
      }

      .env-prod {
        background: #ecf0f1;
        border-left: 4px solid #3498db;
      }

      .env-test {
        background: #f8f9fa;
        border-left: 4px solid #2ecc71;
      }

      .env-title {
        font-weight: bold;
        margin-bottom: 10px;
        color: #2c3e50;
      }

      .field-diff {
        margin: 8px 0;
        padding: 8px;
        border-radius: 4px;
      }

      .field-same {
        background: #d5f4e6;
        border-left: 3px solid #27ae60;
      }

      .field-different {
        background: #fadbd8;
        border-left: 3px solid #e74c3c;
      }

      .field-missing {
        background: #fdebd0;
        border-left: 3px solid #f39c12;
      }

      .field-extra {
        background: #a29bfe;
        border-left: 3px solid #6c5ce7;
      }

      .field-name {
        font-weight: bold;
        color: #2d3436;
      }

      .field-value {
        color: #636e72;
        font-family: "Courier New", monospace;
        font-size: 12px;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* On the prod side: tokens that test is missing (prod is the source of truth). */
      .diff-prod-only {
        background: #fff3bf;
        color: #7a5b00;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #f7a800;
      }

      /* On the test side: tokens that deviate from prod. */
      .diff-test-only {
        background: #f8b4b4;
        color: #7a1f1f;
        padding: 1px 2px;
        border-radius: 2px;
        font-weight: 600;
        box-shadow: inset 0 -2px 0 #e02e49;
      }

      .diff-summary {
        font-family: "Inter", sans-serif;
        font-size: 11px;
        color: var(--grey-600);
        margin-bottom: 6px;
        font-weight: 500;
      }

      .diff-summary strong {
        color: var(--error);
      }

      .expand-icon {
        transition: transform 0.3s;
      }

      .expanded .expand-icon {
        transform: rotate(90deg);
      }

      .filters {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .filter-group label {
        font-weight: 600;
        font-size: 14px;
        color: var(--grey-700);
      }

      .filter-group select,
      .filter-group input {
        padding: 10px 12px;
        border: 1px solid var(--grey-300);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--white);
        transition: all 0.2s ease;
      }

      .filter-group select:focus,
      .filter-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(0, 98, 186, 0.1);
      }

      .filter-group.active select,
      .filter-group.active input {
        border-color: var(--success);
        background-color: var(--grey-50);
      }

      .filter-group.active label {
        color: var(--success);
        font-weight: 700;
      }

      select,
      input {
        padding: 10px 12px;
        border: 1px solid var(--grey-300);
        border-radius: var(--radius-sm);
        font-size: 14px;
        background: var(--white);
      }

      .legend {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
        padding: 16px;
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--grey-200);
        box-shadow: var(--shadow-sm);
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        font-weight: 500;
        color: var(--grey-700);
      }

      .legend-color {
        width: 16px;
        height: 16px;
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-sm);
      }

      @media (max-width: 768px) {
        .item-row {
          grid-template-columns: 1fr;
        }

        .button-group {
          flex-direction: column;
        }

        .filters {
          flex-direction: column;
        }
      }

      .search-section {
        background: var(--primary-light);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--primary);
        box-shadow: var(--shadow);
      }

      .search-section .filter-group input {
        border: 2px solid var(--primary) !important;
        background: var(--white);
        font-size: 16px;
        padding: 14px;
      }

      .search-section .filter-group input:focus {
        border-color: var(--primary-dark) !important;
        box-shadow: 0 0 0 3px rgba(0, 98, 186, 0.1);
        outline: none;
      }

      .view-controls {
        background: var(--grey-100);
        padding: 20px;
        border-radius: var(--radius);
        border: 1px solid var(--grey-300);
        box-shadow: var(--shadow-sm);
      }

      .filters {
        background: var(--white);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--grey-200);
      }

      /* Main items get a left accent to anchor the hierarchy. */
      .item-row {
        border-left: 4px solid var(--primary);
      }

      .subcheckpoints-section {
        display: none;
        background: #eef3f9;
        border-top: 1px solid var(--grey-300);
        padding: 0 0 0 36px;
        position: relative;
      }

      .item-header.expanded ~ .subcheckpoints-section {
        display: block;
      }

      .subcheckpoints-section::before {
        content: "";
        position: absolute;
        left: 16px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--primary);
        opacity: 0.4;
      }

      .subcheckpoints-section-title {
        padding: 10px 20px;
        background: var(--primary-dark);
        color: var(--white);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        text-transform: uppercase;
        margin-left: -36px;
        padding-left: 36px;
      }

      .subcheckpoint-row {
        border-bottom: 1px solid var(--grey-200);
        background: var(--white);
        margin: 6px 12px 6px 0;
        border-radius: var(--radius-sm);
        border-left: 3px solid var(--grey-300);
        box-shadow: var(--shadow-sm);
      }

      .subcheckpoint-row:last-child {
        border-bottom: 1px solid var(--grey-200);
      }

      .subcheckpoint-header {
        padding: 10px 16px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        transition: background-color 0.2s;
      }

      .subcheckpoint-header:hover {
        background: var(--grey-100);
      }

      .subcheckpoint-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--secondary-light);
        color: var(--secondary-dark);
        border: 1px solid var(--secondary);
        padding: 2px 8px;
        border-radius: var(--radius-lg);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-right: 8px;
      }

      .main-label {
        display: inline-flex;
        align-items: center;
        background: var(--primary);
        color: var(--white);
        padding: 3px 10px;
        border-radius: var(--radius-lg);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-right: 10px;
      }

      .subcheckpoint-id {
        font-weight: 700;
        color: var(--grey-800);
      }

      .subcheckpoint-header .item-expand-icon {
        transition: transform 0.3s;
        font-size: 11px;
        margin-left: 10px;
      }

      .subcheckpoint-header.expanded .item-expand-icon {
        transform: rotate(90deg);
      }

      .subcheckpoint-details {
        display: none;
        padding: 12px 16px 14px 16px;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        background: var(--grey-50);
        border-top: 1px dashed var(--grey-300);
      }

      .subcheckpoint-details.expanded {
        display: grid;
      }

      .subcheckpoint-row[data-status="identical"] {
        border-left-color: var(--success);
      }
      .subcheckpoint-row[data-status="different"] {
        border-left-color: var(--error);
      }
      .subcheckpoint-row[data-status="prodOnly"] {
        border-left-color: var(--warning);
      }
      .subcheckpoint-row[data-status="testOnly"] {
        border-left-color: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DIBK Sjekkliste API Forskjellsvisning</h1>

      <div class="controls">
        <div class="button-group">
          <button id="loadData">Last inn data</button>
          <button id="expandAll" disabled>Utvid alle</button>
          <button id="collapseAll" disabled>Kollaps alle</button>
          <button id="exportDiff" disabled>Eksporter forskjeller</button>
        </div>

        <div
          class="search-section"
          style="
            margin-top: 15px;
            background: var(--primary-light);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--primary);
            box-shadow: var(--shadow);
          "
        >
          <div class="filter-group" id="searchFilterGroup" style="margin: 0">
            <label
              for="searchFilter"
              style="font-size: 16px; font-weight: 700; color: var(--primary)"
              >🔍 Søk etter ID eller navn:</label
            >
            <input
              type="text"
              id="searchFilter"
              placeholder="Skriv ID eller navn for å søke..."
              style="margin-top: 8px; font-size: 16px; padding: 14px"
            />
          </div>
        </div>

        <div
          class="view-controls"
          style="
            margin-top: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #6c757d;
          "
        >
          <h4 style="margin: 0 0 10px 0; color: #495057; font-size: 14px">
            ⚙️ Visningsinnstillinger
          </h4>
          <div
            class="filter-group"
            id="expandModeFilterGroup"
            style="margin: 0"
          >
            <label for="expandModeFilter">Vis detaljer:</label>
            <select id="expandModeFilter">
              <option value="collapsed">Kun overskrifter</option>
              <option value="expanded">Vis alle detaljer</option>
              <option value="issues-only">Kun problem-detaljer</option>
            </select>
          </div>
        </div>

        <div class="filters" style="margin-top: 15px; display: none">
          <h4 style="margin: 0 0 15px 0; color: #2c3e50; font-size: 16px">
            🎯 Filter innhold
          </h4>

          <div class="filter-group" id="categoryFilterGroup">
            <label for="categoryFilter">Kategori:</label>
            <select id="categoryFilter">
              <option value="">Alle kategorier</option>
            </select>
          </div>

          <div class="filter-group" id="statusFilterGroup">
            <label for="statusFilter">Vis bare:</label>
            <select id="statusFilter">
              <option value="">Alle elementer</option>
              <option value="issues">
                Kun problemer (forskjeller + manglende)
              </option>
              <option value="different">Kun forskjellige verdier</option>
              <option value="identical">Kun identiske</option>
              <option value="prodOnly">Kun finnes i prod</option>
              <option value="testOnly">Kun finnes i test</option>
            </select>
          </div>

          <div class="filter-group" id="fieldDifferenceFilterGroup">
            <label for="fieldDifferenceFilter">Felt med endringer:</label>
            <select id="fieldDifferenceFilter">
              <option value="">Alle felt</option>
            </select>
          </div>

          <div class="active-filters" id="activeFiltersDisplay">
            <h4>Aktive filter:</h4>
            <div id="activeFilterTags"></div>
            <button class="clear-filters" onclick="clearAllFilters()">
              Fjern alle filter
            </button>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(6, 162, 97, 0.06);
                border: 1px solid rgba(6, 162, 97, 0.3);
              "
            ></div>
            <span>Identisk</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(224, 46, 73, 0.06);
                border: 1px solid rgba(224, 46, 73, 0.3);
              "
            ></div>
            <span>Forskjellig</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(247, 168, 0, 0.06);
                border: 1px solid rgba(247, 168, 0, 0.3);
              "
            ></div>
            <span>Mangler i test</span>
          </div>
          <div class="legend-item">
            <div
              class="legend-color"
              style="
                background: rgba(139, 92, 246, 0.06);
                border: 1px solid rgba(139, 92, 246, 0.3);
              "
            ></div>
            <span>Finnes bare i test</span>
          </div>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none">
        Laster data fra begge endepunkter...
      </div>

      <div id="error" class="error" style="display: none"></div>

      <div id="summary" class="summary" style="display: none">
        <h2>Sammendrag</h2>
        <div class="summary-stats">
          <div class="stat-card stat-identical">
            <h3 id="identicalCount">0</h3>
            <p>Identiske elementer</p>
          </div>
          <div class="stat-card stat-different">
            <h3 id="differentCount">0</h3>
            <p>Forskjellige elementer</p>
          </div>
          <div class="stat-card stat-prod-only">
            <h3 id="prodOnlyCount">0</h3>
            <p>Kun i prod</p>
          </div>
          <div class="stat-card stat-test-only">
            <h3 id="testOnlyCount">0</h3>
            <p>Kun i test</p>
          </div>
        </div>
      </div>

      <div id="results"></div>
    </div>

    <script>
      const PROD_URL = "https://sjekkliste-bygg-api.ft.dibk.no/api/sjekkliste";
      const TEST_URL =
        "https://sjekkliste-bygg-api.ft-test.dibk.no/api/sjekkliste";

      let prodData = null;
      let testData = null;
      let comparisonData = null;

      // Event listeners
      document.getElementById("loadData").addEventListener("click", loadData);
      document
        .getElementById("expandAll")
        .addEventListener("click", () => toggleAllCategories(true));
      document
        .getElementById("collapseAll")
        .addEventListener("click", () => toggleAllCategories(false));
      document
        .getElementById("exportDiff")
        .addEventListener("click", exportDifferences);
      document
        .getElementById("categoryFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("statusFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("searchFilter")
        .addEventListener("input", applyFilters);
      document
        .getElementById("fieldDifferenceFilter")
        .addEventListener("change", applyFilters);
      document
        .getElementById("expandModeFilter")
        .addEventListener("change", applyExpandMode);
      document
        .getElementById("expandModeFilter")
        .addEventListener("change", applyExpandMode);

      async function loadData() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const loadButton = document.getElementById("loadData");

        loading.style.display = "block";
        error.style.display = "none";
        loadButton.disabled = true;

        try {
          // Load data from both endpoints
          const [prodResponse, testResponse] = await Promise.all([
            fetch(PROD_URL, {
              method: "GET",
              mode: "cors",
              headers: {
                Accept: "application/json",
              },
            }),
            fetch(TEST_URL, {
              method: "GET",
              mode: "cors",
              headers: {
                Accept: "application/json",
              },
            }),
          ]);

          if (!prodResponse.ok) {
            throw new Error(
              `Prod API feil: ${prodResponse.status} ${prodResponse.statusText}`,
            );
          }
          if (!testResponse.ok) {
            throw new Error(
              `Test API feil: ${testResponse.status} ${testResponse.statusText}`,
            );
          }

          prodData = await prodResponse.json();
          testData = await testResponse.json();

          console.log("Prod data:", prodData);
          console.log("Test data:", testData);

          // Compare the data
          comparisonData = compareData(prodData, testData);

          // Display results
          displayResults(comparisonData);

          // Enable controls
          document.getElementById("expandAll").disabled = false;
          document.getElementById("collapseAll").disabled = false;
          document.getElementById("exportDiff").disabled = false;
          document.querySelector(".filters").style.display = "flex";
        } catch (err) {
          console.error("Error loading data:", err);
          error.textContent = `Feil ved lasting av data: ${err.message}`;
          error.style.display = "block";
        } finally {
          loading.style.display = "none";
          loadButton.disabled = false;
        }
      }

      function compareData(prodData, testData) {
        // Group data by Prosesskategori
        const prodByCategory = groupByCategory(prodData);
        const testByCategory = groupByCategory(testData);

        const result = {
          categories: {},
          summary: {
            identical: 0,
            different: 0,
            prodOnly: 0,
            testOnly: 0,
          },
        };

        // Get all unique categories
        const allCategories = new Set([
          ...Object.keys(prodByCategory),
          ...Object.keys(testByCategory),
        ]);

        allCategories.forEach((category) => {
          const prodItems = prodByCategory[category] || [];
          const testItems = testByCategory[category] || [];

          result.categories[category] = compareCategory(prodItems, testItems);

          // Update summary
          Object.values(result.categories[category].items).forEach((item) => {
            result.summary[item.status]++;
          });
        });

        return result;
      }

      function groupByCategory(data) {
        const grouped = {};

        if (Array.isArray(data)) {
          data.forEach((item) => {
            const category = item.Prosesskategori || "Ukjent kategori";
            if (!grouped[category]) {
              grouped[category] = [];
            }
            grouped[category].push(item);
          });
        }

        return grouped;
      }

      function compareCategory(prodItems, testItems) {
        const result = {
          items: {},
          stats: { identical: 0, different: 0, prodOnly: 0, testOnly: 0 },
        };

        // Create lookup maps by Id
        const prodMap = {};
        const testMap = {};

        prodItems.forEach((item) => {
          const id = item.Id || "unknown";
          prodMap[id] = item;
        });

        testItems.forEach((item) => {
          const id = item.Id || "unknown";
          testMap[id] = item;
        });

        // Get all unique IDs
        const allIds = new Set([
          ...Object.keys(prodMap),
          ...Object.keys(testMap),
        ]);

        allIds.forEach((id) => {
          const prodItem = prodMap[id];
          const testItem = testMap[id];

          if (prodItem && testItem) {
            // Item exists in both
            const comparison = compareItems(prodItem, testItem);
            result.items[id] = {
              id: id,
              status: comparison.identical ? "identical" : "different",
              prodItem: prodItem,
              testItem: testItem,
              differences: comparison.differences,
            };
            result.stats[comparison.identical ? "identical" : "different"]++;
          } else if (prodItem && !testItem) {
            // Only in prod
            result.items[id] = {
              id: id,
              status: "prodOnly",
              prodItem: prodItem,
              testItem: null,
              differences: [],
            };
            result.stats.prodOnly++;
          } else if (!prodItem && testItem) {
            // Only in test
            result.items[id] = {
              id: id,
              status: "testOnly",
              prodItem: null,
              testItem: testItem,
              differences: [],
            };
            result.stats.testOnly++;
          }
        });

        return result;
      }

      function compareItems(prodItem, testItem) {
        const differences = [];
        let identical = true;

        // Fields to ignore in comparison (timestamps, etc.)
        const fieldsToIgnore = [
          "Oppdatert",
          "Updated",
          "LastModified",
          "Timestamp",
        ];

        // Get all unique keys, excluding fields to ignore
        const allKeys = new Set([
          ...Object.keys(prodItem || {}),
          ...Object.keys(testItem || {}),
        ]);

        // Filter out ignored fields
        const keysToCompare = Array.from(allKeys).filter(
          (key) => !fieldsToIgnore.includes(key),
        );

        keysToCompare.forEach((key) => {
          const prodValue = prodItem ? prodItem[key] : undefined;
          const testValue = testItem ? testItem[key] : undefined;

          // Special handling for Undersjekkpunkter - deep compare each subcheckpoint by Id
          if (key === "Undersjekkpunkter") {
            if (prodValue === undefined && testValue === undefined) {
              return;
            }
            if (prodValue === undefined && testValue !== undefined) {
              differences.push({
                field: key,
                type: "missing_in_prod",
                prodValue: undefined,
                testValue: testValue,
              });
              identical = false;
              return;
            }
            if (prodValue !== undefined && testValue === undefined) {
              differences.push({
                field: key,
                type: "missing_in_test",
                prodValue: prodValue,
                testValue: undefined,
              });
              identical = false;
              return;
            }

            const subResult = compareSubcheckpoints(prodValue, testValue);
            const subIdentical =
              subResult.stats.different === 0 &&
              subResult.stats.prodOnly === 0 &&
              subResult.stats.testOnly === 0;

            differences.push({
              field: key,
              type: subIdentical ? "same" : "different",
              prodValue: prodValue,
              testValue: testValue,
              subResult: subResult,
            });

            if (!subIdentical) identical = false;
            return;
          }

          if (prodValue === undefined && testValue !== undefined) {
            differences.push({
              field: key,
              type: "missing_in_prod",
              prodValue: undefined,
              testValue: testValue,
            });
            identical = false;
          } else if (prodValue !== undefined && testValue === undefined) {
            differences.push({
              field: key,
              type: "missing_in_test",
              prodValue: prodValue,
              testValue: undefined,
            });
            identical = false;
          } else if (!deepEqual(prodValue, testValue)) {
            differences.push({
              field: key,
              type: "different",
              prodValue: prodValue,
              testValue: testValue,
            });
            identical = false;
          } else {
            differences.push({
              field: key,
              type: "same",
              prodValue: prodValue,
              testValue: testValue,
            });
          }
        });

        return { identical, differences };
      }

      function compareSubcheckpoints(prodArray, testArray) {
        const result = {
          subItems: {},
          stats: { identical: 0, different: 0, prodOnly: 0, testOnly: 0 },
        };

        const prodMap = {};
        const testMap = {};

        if (Array.isArray(prodArray)) {
          prodArray.forEach((item, idx) => {
            const id =
              item && item.Id !== undefined && item.Id !== null
                ? item.Id
                : `__idx_${idx}`;
            prodMap[id] = item;
          });
        }
        if (Array.isArray(testArray)) {
          testArray.forEach((item, idx) => {
            const id =
              item && item.Id !== undefined && item.Id !== null
                ? item.Id
                : `__idx_${idx}`;
            testMap[id] = item;
          });
        }

        const allIds = new Set([
          ...Object.keys(prodMap),
          ...Object.keys(testMap),
        ]);

        allIds.forEach((id) => {
          const prodItem = prodMap[id];
          const testItem = testMap[id];

          if (prodItem && testItem) {
            const comparison = compareItems(prodItem, testItem);
            result.subItems[id] = {
              id: id,
              status: comparison.identical ? "identical" : "different",
              prodItem: prodItem,
              testItem: testItem,
              differences: comparison.differences,
            };
            result.stats[comparison.identical ? "identical" : "different"]++;
          } else if (prodItem) {
            result.subItems[id] = {
              id: id,
              status: "prodOnly",
              prodItem: prodItem,
              testItem: null,
              differences: [],
            };
            result.stats.prodOnly++;
          } else if (testItem) {
            result.subItems[id] = {
              id: id,
              status: "testOnly",
              prodItem: null,
              testItem: testItem,
              differences: [],
            };
            result.stats.testOnly++;
          }
        });

        return result;
      }

      function deepEqual(a, b) {
        if (a === b) return true;

        if (a == null || b == null) return false;

        if (typeof a !== typeof b) return false;

        if (typeof a === "object") {
          if (Array.isArray(a) !== Array.isArray(b)) return false;

          const keysA = Object.keys(a);
          const keysB = Object.keys(b);

          if (keysA.length !== keysB.length) return false;

          for (let key of keysA) {
            if (!keysB.includes(key)) return false;
            if (!deepEqual(a[key], b[key])) return false;
          }

          return true;
        }

        return false;
      }

      function displayResults(comparisonData) {
        // Update summary
        updateSummary(comparisonData.summary);

        // Update category filter
        updateCategoryFilter(Object.keys(comparisonData.categories));

        // Update field difference filter
        updateFieldDifferenceFilter(comparisonData.categories);

        // Initialize filter visual states
        updateFilterVisualStates();

        // Display comparison results
        const resultsContainer = document.getElementById("results");
        resultsContainer.innerHTML = "";

        Object.keys(comparisonData.categories)
          .sort()
          .forEach((category) => {
            const categoryData = comparisonData.categories[category];
            const categoryElement = createCategoryElement(
              category,
              categoryData,
            );
            resultsContainer.appendChild(categoryElement);
          });

        document.getElementById("summary").style.display = "block";
      }

      function updateSummary(summary) {
        document.getElementById("identicalCount").textContent =
          summary.identical;
        document.getElementById("differentCount").textContent =
          summary.different;
        document.getElementById("prodOnlyCount").textContent = summary.prodOnly;
        document.getElementById("testOnlyCount").textContent = summary.testOnly;
      }

      function updateCategoryFilter(categories) {
        const select = document.getElementById("categoryFilter");
        select.innerHTML = '<option value="">Alle kategorier</option>';

        categories.sort().forEach((category) => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          select.appendChild(option);
        });
      }

      function updateFieldDifferenceFilter(categoriesData) {
        const select = document.getElementById("fieldDifferenceFilter");
        select.innerHTML = '<option value="">Alle felt</option>';

        const allFieldsWithDifferences = new Set();

        // Samle alle felt som har forskjeller fra alle kategorier
        Object.values(categoriesData).forEach((categoryData) => {
          Object.values(categoryData.items).forEach((item) => {
            if (item.differences) {
              item.differences
                .filter((diff) => diff.type !== "same")
                .forEach((diff) => {
                  allFieldsWithDifferences.add(diff.field);
                });
            }
          });
        });

        // Legg til felt i dropdown sortert alfabetisk
        [...allFieldsWithDifferences].sort().forEach((field) => {
          const option = document.createElement("option");
          option.value = field;
          option.textContent = field;
          select.appendChild(option);
        });
      }

      function createCategoryElement(category, categoryData) {
        const categoryElement = document.createElement("div");
        categoryElement.className = "category-group";
        categoryElement.dataset.category = category;

        const stats = categoryData.stats;
        const totalItems = Object.keys(categoryData.items).length;
        const hasIssues =
          stats.different > 0 || stats.prodOnly > 0 || stats.testOnly > 0;

        const header = document.createElement("div");
        header.className = "category-header";

        const leftSide = document.createElement("div");
        leftSide.innerHTML = `
                <div style="font-size: 18px; margin-bottom: 5px;">${category}</div>
                <div class="category-stats">
                    <span class="stat-badge">${totalItems} elementer</span>
                    ${stats.identical > 0 ? `<span class="stat-badge" style="background: #27ae60;">✓ ${stats.identical} identiske</span>` : ""}
                    ${stats.different > 0 ? `<span class="stat-badge has-issues" style="background: #e74c3c;">⚠ ${stats.different} forskjellige</span>` : ""}
                    ${stats.prodOnly > 0 ? `<span class="stat-badge has-issues" style="background: #f39c12;">📤 ${stats.prodOnly} kun i prod</span>` : ""}
                    ${stats.testOnly > 0 ? `<span class="stat-badge has-issues" style="background: #9b59b6;">📥 ${stats.testOnly} kun i test</span>` : ""}
                </div>
            `;

        const rightSide = document.createElement("span");
        rightSide.className = "expand-icon";
        rightSide.textContent = "▶";

        header.appendChild(leftSide);
        header.appendChild(rightSide);

        header.addEventListener("click", (e) => {
          e.preventDefault();
          const content = categoryElement.querySelector(".category-content");
          if (content) {
            content.classList.toggle("expanded");
            header.classList.toggle("expanded");
            console.log(
              "Toggled category:",
              category,
              "expanded:",
              content.classList.contains("expanded"),
            );
          }
        });

        const content = document.createElement("div");
        content.className = "category-content";

        // Sort items by ID
        const sortedIds = Object.keys(categoryData.items).sort();

        sortedIds.forEach((id) => {
          const itemData = categoryData.items[id];
          const itemElement = createItemElement(itemData);
          content.appendChild(itemElement);
        });

        categoryElement.appendChild(header);
        categoryElement.appendChild(content);

        return categoryElement;
      }

      function createItemElement(itemData) {
        const itemElement = document.createElement("div");
        itemElement.className = "item-row";
        itemElement.dataset.status = itemData.status;
        itemElement.dataset.id = itemData.id;

        // Add fields that have differences for filtering
        const fieldsWithDifferences = itemData.differences
          ? [
              ...new Set(
                itemData.differences
                  .filter((diff) => diff.type !== "same")
                  .map((diff) => diff.field),
              ),
            ].join(",")
          : "";
        itemElement.dataset.fieldsWithDifferences = fieldsWithDifferences;

        // Searchable IDs (exact match) and names (substring match)
        const searchIds = new Set([String(itemData.id).toLowerCase()]);
        const searchNames = [];
        const collectTokens = (it) => {
          if (!it) return;
          if (it.Navn) searchNames.push(String(it.Navn));
          if (it.NavnNynorsk) searchNames.push(String(it.NavnNynorsk));
          if (Array.isArray(it.Undersjekkpunkter)) {
            it.Undersjekkpunkter.forEach((sub) => {
              if (sub && sub.Id !== undefined)
                searchIds.add(String(sub.Id).toLowerCase());
              if (sub && sub.Navn) searchNames.push(String(sub.Navn));
              if (sub && sub.NavnNynorsk)
                searchNames.push(String(sub.NavnNynorsk));
            });
          }
        };
        collectTokens(itemData.prodItem);
        collectTokens(itemData.testItem);
        itemElement.dataset.searchIds = [...searchIds].join("|");
        itemElement.dataset.searchNames = searchNames.join(" ").toLowerCase();

        const header = document.createElement("div");
        header.className = "item-header";

        const leftSide = document.createElement("div");
        leftSide.style.display = "flex";
        leftSide.style.alignItems = "center";

        const mainLabel = document.createElement("span");
        mainLabel.className = "main-label";
        mainLabel.textContent = "Hovedpunkt";

        const itemTitle = document.createElement("span");
        itemTitle.textContent = itemData.id;
        itemTitle.style.fontWeight = "bold";
        itemTitle.style.fontSize = "15px";

        const expandIcon = document.createElement("span");
        expandIcon.className = "item-expand-icon";
        expandIcon.textContent = "▶";

        leftSide.appendChild(mainLabel);
        leftSide.appendChild(itemTitle);
        leftSide.appendChild(expandIcon);

        const statusBadge = document.createElement("div");
        statusBadge.className = `item-status-badge status-${itemData.status.replace("Only", "-only")}`;

        switch (itemData.status) {
          case "identical":
            statusBadge.textContent = "✓ Identisk";
            break;
          case "different":
            const diffCount = itemData.differences.filter(
              (d) => d.type === "different",
            ).length;
            statusBadge.textContent = `⚠ ${diffCount} forskjeller`;
            break;
          case "prodOnly":
            statusBadge.textContent = "📤 Kun i Prod";
            break;
          case "testOnly":
            statusBadge.textContent = "📥 Kun i Test";
            break;
        }

        header.appendChild(leftSide);
        header.appendChild(statusBadge);

        // Add click handler for expanding/collapsing
        header.addEventListener("click", (e) => {
          e.preventDefault();
          const details = itemElement.querySelector(".item-details");
          if (details) {
            details.classList.toggle("expanded");
            header.classList.toggle("expanded");
            console.log(
              "Toggled item:",
              itemData.id,
              "expanded:",
              details.classList.contains("expanded"),
            );
          }
        });

        itemElement.appendChild(header);

        // Create details section
        const details = document.createElement("div");
        details.className = "item-details";

        const prodColumn = document.createElement("div");
        prodColumn.className = "env-column env-prod";

        const testColumn = document.createElement("div");
        testColumn.className = "env-column env-test";

        prodColumn.innerHTML = `<div class="env-title">Prod</div>`;
        testColumn.innerHTML = `<div class="env-title">Test</div>`;

        if (itemData.status === "prodOnly") {
          prodColumn.appendChild(createItemDetails(itemData.prodItem));
          testColumn.innerHTML +=
            '<div style="color: #e74c3c; font-style: italic; padding: 15px;">Ikke funnet</div>';
        } else if (itemData.status === "testOnly") {
          prodColumn.innerHTML +=
            '<div style="color: #e74c3c; font-style: italic; padding: 15px;">Ikke funnet</div>';
          testColumn.appendChild(createItemDetails(itemData.testItem));
        } else {
          // Show differences
          itemData.differences.forEach((diff) => {
            const fieldElement = createFieldDifference(diff);
            prodColumn.appendChild(fieldElement.prod);
            testColumn.appendChild(fieldElement.test);
          });
        }

        details.appendChild(prodColumn);
        details.appendChild(testColumn);
        itemElement.appendChild(details);

        // Subcheckpoints section
        let subResultToShow = null;
        if (
          itemData.status === "prodOnly" &&
          itemData.prodItem &&
          Array.isArray(itemData.prodItem.Undersjekkpunkter) &&
          itemData.prodItem.Undersjekkpunkter.length > 0
        ) {
          subResultToShow = compareSubcheckpoints(
            itemData.prodItem.Undersjekkpunkter,
            null,
          );
        } else if (
          itemData.status === "testOnly" &&
          itemData.testItem &&
          Array.isArray(itemData.testItem.Undersjekkpunkter) &&
          itemData.testItem.Undersjekkpunkter.length > 0
        ) {
          subResultToShow = compareSubcheckpoints(
            null,
            itemData.testItem.Undersjekkpunkter,
          );
        } else if (itemData.differences) {
          const undersjekkDiff = itemData.differences.find(
            (d) => d.field === "Undersjekkpunkter" && d.subResult,
          );
          if (undersjekkDiff) subResultToShow = undersjekkDiff.subResult;
        }

        if (
          subResultToShow &&
          Object.keys(subResultToShow.subItems).length > 0
        ) {
          itemElement.appendChild(createSubcheckpointsSection(subResultToShow));
        }

        return itemElement;
      }

      function createSubcheckpointsSection(subResult) {
        const section = document.createElement("div");
        section.className = "subcheckpoints-section";

        const stats = subResult.stats;
        const total =
          stats.identical + stats.different + stats.prodOnly + stats.testOnly;

        const header = document.createElement("div");
        header.className = "subcheckpoints-section-title";
        header.innerHTML = `
                <div>↳ Underpunkter (${total})</div>
                <div class="category-stats">
                    ${stats.identical > 0 ? `<span class="stat-badge" style="background: rgba(255,255,255,0.2);">✓ ${stats.identical}</span>` : ""}
                    ${stats.different > 0 ? `<span class="stat-badge" style="background: var(--error);">⚠ ${stats.different}</span>` : ""}
                    ${stats.prodOnly > 0 ? `<span class="stat-badge" style="background: var(--warning);">📤 ${stats.prodOnly}</span>` : ""}
                    ${stats.testOnly > 0 ? `<span class="stat-badge" style="background: #8b5cf6;">📥 ${stats.testOnly}</span>` : ""}
                </div>
            `;
        section.appendChild(header);

        const list = document.createElement("div");
        list.className = "subcheckpoints-list";

        Object.keys(subResult.subItems)
          .sort()
          .forEach((id) => {
            list.appendChild(
              createSubcheckpointElement(subResult.subItems[id]),
            );
          });

        section.appendChild(list);
        return section;
      }

      function createSubcheckpointElement(subItemData) {
        const row = document.createElement("div");
        row.className = "subcheckpoint-row";
        row.dataset.status = subItemData.status;
        row.dataset.id = subItemData.id;

        const header = document.createElement("div");
        header.className = "subcheckpoint-header";

        const left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";

        const label = document.createElement("span");
        label.className = "subcheckpoint-label";
        label.textContent = "Underpunkt";

        const title = document.createElement("span");
        title.className = "subcheckpoint-id";
        title.textContent = subItemData.id;

        const expandIcon = document.createElement("span");
        expandIcon.className = "item-expand-icon";
        expandIcon.textContent = "▶";

        left.appendChild(label);
        left.appendChild(title);
        left.appendChild(expandIcon);

        const statusBadge = document.createElement("div");
        statusBadge.className = `item-status-badge status-${subItemData.status.replace("Only", "-only")}`;

        switch (subItemData.status) {
          case "identical":
            statusBadge.textContent = "✓ Identisk";
            break;
          case "different":
            const diffCount = subItemData.differences.filter(
              (d) => d.type === "different",
            ).length;
            statusBadge.textContent = `⚠ ${diffCount} forskjeller`;
            break;
          case "prodOnly":
            statusBadge.textContent = "📤 Kun i Prod";
            break;
          case "testOnly":
            statusBadge.textContent = "📥 Kun i Test";
            break;
        }

        header.appendChild(left);
        header.appendChild(statusBadge);

        header.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const d = row.querySelector(".subcheckpoint-details");
          if (d) {
            d.classList.toggle("expanded");
            header.classList.toggle("expanded");
          }
        });

        row.appendChild(header);

        const details = document.createElement("div");
        details.className = "subcheckpoint-details";

        const prodCol = document.createElement("div");
        prodCol.className = "env-column env-prod";
        const testCol = document.createElement("div");
        testCol.className = "env-column env-test";

        prodCol.innerHTML = `<div class="env-title">Prod</div>`;
        testCol.innerHTML = `<div class="env-title">Test</div>`;

        if (subItemData.status === "prodOnly") {
          prodCol.appendChild(createItemDetails(subItemData.prodItem));
          testCol.innerHTML +=
            '<div style="color: #e74c3c; font-style: italic; padding: 15px;">Ikke funnet</div>';
        } else if (subItemData.status === "testOnly") {
          prodCol.innerHTML +=
            '<div style="color: #e74c3c; font-style: italic; padding: 15px;">Ikke funnet</div>';
          testCol.appendChild(createItemDetails(subItemData.testItem));
        } else {
          subItemData.differences.forEach((diff) => {
            const fld = createFieldDifference(diff);
            prodCol.appendChild(fld.prod);
            testCol.appendChild(fld.test);
          });
        }

        details.appendChild(prodCol);
        details.appendChild(testCol);
        row.appendChild(details);

        return row;
      }

      function createItemDetails(item) {
        const container = document.createElement("div");

        Object.keys(item).forEach((key) => {
          const value = item[key];

          // Skip undersjekkpunkter arrays - show only summary
          if (key === "Undersjekkpunkter" && Array.isArray(value)) {
            const fieldDiv = document.createElement("div");
            fieldDiv.className = "field-diff field-same";

            const nameDiv = document.createElement("div");
            nameDiv.className = "field-name";
            nameDiv.textContent = key;

            const valueDiv = document.createElement("div");
            valueDiv.className = "field-value";
            if (value.length > 0) {
              const ids = value
                .map((item) => item.Id || "Ukjent ID")
                .join(", ");
              valueDiv.innerHTML = `<strong>${value.length} undersjekkpunkt${value.length !== 1 ? "er" : ""}:</strong><br>${ids}`;
            } else {
              valueDiv.textContent = "Ingen undersjekkpunkter";
            }

            fieldDiv.appendChild(nameDiv);
            fieldDiv.appendChild(valueDiv);
            container.appendChild(fieldDiv);
            return;
          }

          // Normal fielder
          const fieldDiv = document.createElement("div");
          fieldDiv.className = "field-diff field-same";

          const nameDiv = document.createElement("div");
          nameDiv.className = "field-name";
          nameDiv.textContent = key;

          const valueDiv = document.createElement("div");
          valueDiv.className = "field-value";
          valueDiv.textContent = formatValue(value);

          fieldDiv.appendChild(nameDiv);
          fieldDiv.appendChild(valueDiv);
          container.appendChild(fieldDiv);
        });

        return container;
      }

      function createFieldDifference(diff) {
        const prodDiv = document.createElement("div");
        const testDiv = document.createElement("div");

        let className = "field-diff ";
        switch (diff.type) {
          case "same":
            className += "field-same";
            break;
          case "different":
            className += "field-different";
            break;
          case "missing_in_test":
            className += "field-missing";
            break;
          case "missing_in_prod":
            className += "field-extra";
            break;
        }

        prodDiv.className = className;
        testDiv.className = className;

        // Special handling for Undersjekkpunkter
        if (diff.field === "Undersjekkpunkter") {
          const prodName = document.createElement("div");
          prodName.className = "field-name";
          prodName.textContent = diff.field;

          const testName = document.createElement("div");
          testName.className = "field-name";
          testName.textContent = diff.field;

          const prodValue = document.createElement("div");
          prodValue.className = "field-value";

          const testValue = document.createElement("div");
          testValue.className = "field-value";

          let summaryProd = null;
          let summaryTest = null;
          if (diff.type === "different") {
            const idDiff = diffUndersjekkpunkterIds(
              diff.prodValue,
              diff.testValue,
            );
            if (idDiff.onlyInProd.length || idDiff.onlyInTest.length) {
              const parts = [];
              if (idDiff.onlyInProd.length)
                parts.push(
                  `<strong>${idDiff.onlyInProd.length}</strong> mangler i test`,
                );
              if (idDiff.onlyInTest.length)
                parts.push(
                  `<strong>${idDiff.onlyInTest.length}</strong> avvik i test`,
                );
              summaryProd = document.createElement("div");
              summaryProd.className = "diff-summary";
              summaryProd.innerHTML = `Avvik fra prod: ${parts.join(", ")}`;
              summaryTest = summaryProd.cloneNode(true);
            }
            prodValue.innerHTML = idDiff.prodHtml;
            testValue.innerHTML = idDiff.testHtml;
          } else {
            prodValue.innerHTML = formatUndersjekkpunkter(diff.prodValue);
            testValue.innerHTML = formatUndersjekkpunkter(diff.testValue);
          }

          prodDiv.appendChild(prodName);
          if (summaryProd) prodDiv.appendChild(summaryProd);
          prodDiv.appendChild(prodValue);
          testDiv.appendChild(testName);
          if (summaryTest) testDiv.appendChild(summaryTest);
          testDiv.appendChild(testValue);

          return { prod: prodDiv, test: testDiv };
        }

        // Field name
        const prodName = document.createElement("div");
        prodName.className = "field-name";
        prodName.textContent = diff.field;

        const testName = document.createElement("div");
        testName.className = "field-name";
        testName.textContent = diff.field;

        // Field values
        const prodValue = document.createElement("div");
        prodValue.className = "field-value";

        const testValue = document.createElement("div");
        testValue.className = "field-value";

        let summaryProd = null;
        let summaryTest = null;
        if (diff.type === "different") {
          const inline = inlineDiff(diff.prodValue, diff.testValue);
          prodValue.innerHTML = inline.prodHtml;
          testValue.innerHTML = inline.testHtml;

          summaryProd = document.createElement("div");
          summaryProd.className = "diff-summary";
          summaryProd.innerHTML = `Avvik fra prod: <strong>${inline.missingInTest}</strong> mangler i test, <strong>${inline.deviatesFromProd}</strong> avvik i test`;
          summaryTest = summaryProd.cloneNode(true);
        } else {
          prodValue.textContent = formatValue(diff.prodValue);
          testValue.textContent = formatValue(diff.testValue);
        }

        prodDiv.appendChild(prodName);
        if (summaryProd) prodDiv.appendChild(summaryProd);
        prodDiv.appendChild(prodValue);
        testDiv.appendChild(testName);
        if (summaryTest) testDiv.appendChild(summaryTest);
        testDiv.appendChild(testValue);

        return { prod: prodDiv, test: testDiv };
      }

      function formatValue(value) {
        if (value === undefined) return "(mangler)";
        if (value === null) return "(null)";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function tokenize(str) {
        // Split into words, whitespace, and punctuation so the diff stays readable.
        return String(str).match(/\s+|[A-Za-zÆØÅæøå0-9_]+|[^\s\w]/g) || [];
      }

      function lcsDiff(aTokens, bTokens) {
        const m = aTokens.length,
          n = bTokens.length;
        const dp = Array.from({ length: m + 1 }, () => new Uint32Array(n + 1));
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            if (aTokens[i - 1] === bTokens[j - 1]) {
              dp[i][j] = dp[i - 1][j - 1] + 1;
            } else {
              dp[i][j] =
                dp[i - 1][j] >= dp[i][j - 1] ? dp[i - 1][j] : dp[i][j - 1];
            }
          }
        }
        const ops = [];
        let i = m,
          j = n;
        while (i > 0 && j > 0) {
          if (aTokens[i - 1] === bTokens[j - 1]) {
            ops.unshift({ type: "eq", token: aTokens[i - 1] });
            i--;
            j--;
          } else if (dp[i - 1][j] >= dp[i][j - 1]) {
            ops.unshift({ type: "del", token: aTokens[i - 1] });
            i--;
          } else {
            ops.unshift({ type: "ins", token: bTokens[j - 1] });
            j--;
          }
        }
        while (i > 0) {
          ops.unshift({ type: "del", token: aTokens[i - 1] });
          i--;
        }
        while (j > 0) {
          ops.unshift({ type: "ins", token: bTokens[j - 1] });
          j--;
        }
        return ops;
      }

      function inlineDiff(prodValue, testValue) {
        const prodStr = formatValue(prodValue);
        const testStr = formatValue(testValue);
        const aTokens = tokenize(prodStr);
        const bTokens = tokenize(testStr);
        const ops = lcsDiff(aTokens, bTokens);

        let prodHtml = "";
        let testHtml = "";
        let missingInTest = 0,
          deviatesFromProd = 0;

        ops.forEach((op) => {
          const escaped = escapeHtml(op.token);
          if (op.type === "eq") {
            prodHtml += escaped;
            testHtml += escaped;
          } else if (op.type === "del") {
            // In prod but not in test — test is missing this.
            prodHtml += `<span class="diff-prod-only">${escaped}</span>`;
            if (op.token.trim()) missingInTest++;
          } else if (op.type === "ins") {
            // In test but not in prod — test deviates from prod.
            testHtml += `<span class="diff-test-only">${escaped}</span>`;
            if (op.token.trim()) deviatesFromProd++;
          }
        });

        return { prodHtml, testHtml, missingInTest, deviatesFromProd };
      }

      function diffUndersjekkpunkterIds(prodValue, testValue) {
        const prodIds = Array.isArray(prodValue)
          ? prodValue.map((x) => x && x.Id).filter((x) => x !== undefined)
          : [];
        const testIds = Array.isArray(testValue)
          ? testValue.map((x) => x && x.Id).filter((x) => x !== undefined)
          : [];
        const prodSet = new Set(prodIds);
        const testSet = new Set(testIds);
        const onlyInProd = prodIds.filter((id) => !testSet.has(id));
        const onlyInTest = testIds.filter((id) => !prodSet.has(id));

        const renderProd = prodIds
          .map((id) =>
            testSet.has(id)
              ? escapeHtml(id)
              : `<span class="diff-prod-only">${escapeHtml(id)}</span>`,
          )
          .join(", ");
        const renderTest = testIds
          .map((id) =>
            prodSet.has(id)
              ? escapeHtml(id)
              : `<span class="diff-test-only">${escapeHtml(id)}</span>`,
          )
          .join(", ");

        const prodLabel = `<strong>${prodIds.length} undersjekkpunkt${prodIds.length !== 1 ? "er" : ""}:</strong><br>`;
        const testLabel = `<strong>${testIds.length} undersjekkpunkt${testIds.length !== 1 ? "er" : ""}:</strong><br>`;

        return {
          prodHtml: prodLabel + (renderProd || "<em>Ingen</em>"),
          testHtml: testLabel + (renderTest || "<em>Ingen</em>"),
          onlyInProd,
          onlyInTest,
        };
      }

      function formatUndersjekkpunkter(value) {
        if (value === undefined) return "(mangler)";
        if (value === null) return "(null)";
        if (!Array.isArray(value)) return String(value);

        if (value.length === 0) {
          return "Ingen undersjekkpunkter";
        }

        const ids = value.map((item) => item.Id || "Ukjent ID").join(", ");
        return `<strong>${value.length} undersjekkpunkt${value.length !== 1 ? "er" : ""}:</strong><br>${ids}`;
      }

      function toggleAllCategories(expand) {
        const categories = document.querySelectorAll(".category-group");
        categories.forEach((category) => {
          const content = category.querySelector(".category-content");
          const header = category.querySelector(".category-header");
          const method = expand ? "add" : "remove";

          content.classList[method]("expanded");
          header.classList[method]("expanded");

          const items = category.querySelectorAll(".item-row");
          items.forEach((item) => {
            item.querySelector(".item-details").classList[method]("expanded");
            item.querySelector(".item-header").classList[method]("expanded");
          });

          category
            .querySelectorAll(".subcheckpoint-details")
            .forEach((d) => d.classList[method]("expanded"));
          category
            .querySelectorAll(".subcheckpoint-header")
            .forEach((h) => h.classList[method]("expanded"));
        });
      }

      function applyFilters() {
        const categoryFilter = document.getElementById("categoryFilter").value;
        const statusFilter = document.getElementById("statusFilter").value;
        const searchFilter = document
          .getElementById("searchFilter")
          .value.toLowerCase();
        const fieldDifferenceFilter = document.getElementById(
          "fieldDifferenceFilter",
        ).value;

        // Update filter visual states
        updateFilterVisualStates();

        const categories = document.querySelectorAll(".category-group");

        categories.forEach((categoryElement) => {
          const category = categoryElement.dataset.category;
          let showCategory = true;

          // Category filter
          if (categoryFilter && category !== categoryFilter) {
            showCategory = false;
          }

          if (showCategory) {
            const items = categoryElement.querySelectorAll(".item-row");
            let visibleItems = 0;

            items.forEach((item) => {
              const status = item.dataset.status;
              const id = item.dataset.id.toLowerCase();
              const searchIds = (item.dataset.searchIds || id).split("|");
              const searchNames = item.dataset.searchNames || "";
              const fieldsWithDifferences =
                item.dataset.fieldsWithDifferences || "";
              let showItem = true;

              // Status filter
              if (statusFilter === "issues") {
                showItem =
                  status === "different" ||
                  status === "prodOnly" ||
                  status === "testOnly";
              } else if (statusFilter && status !== statusFilter) {
                showItem = false;
              }

              // Search filter: exact ID match OR substring name match
              if (searchFilter) {
                const exactIdMatch = searchIds.includes(searchFilter);
                const nameMatch = searchNames.includes(searchFilter);
                if (!exactIdMatch && !nameMatch) {
                  showItem = false;
                }
              }

              // Field difference filter
              if (
                fieldDifferenceFilter &&
                !fieldsWithDifferences
                  .split(",")
                  .includes(fieldDifferenceFilter)
              ) {
                showItem = false;
              }

              item.style.display = showItem ? "block" : "none";
              if (showItem) visibleItems++;

              // Auto-expand when the match is inside a subcheckpoint
              if (showItem && searchFilter) {
                const mainMatches = id === searchFilter;
                const subRows = item.querySelectorAll(".subcheckpoint-row");
                let anySubMatches = false;
                subRows.forEach((sub) => {
                  const subId = (sub.dataset.id || "").toLowerCase();
                  if (subId === searchFilter) {
                    anySubMatches = true;
                    const sh = sub.querySelector(".subcheckpoint-header");
                    const sd = sub.querySelector(".subcheckpoint-details");
                    if (sh) sh.classList.add("expanded");
                    if (sd) sd.classList.add("expanded");
                  }
                });
                if (anySubMatches && !mainMatches) {
                  const itemHeader = item.querySelector(".item-header");
                  const itemDetails = item.querySelector(".item-details");
                  if (itemHeader) itemHeader.classList.add("expanded");
                  if (itemDetails) itemDetails.classList.add("expanded");
                }
              }
            });

            // Update category header with visible count
            const leftSide = categoryElement.querySelector(
              ".category-header > div",
            );
            const titleDiv = leftSide.querySelector("div");
            titleDiv.textContent = `${category}`;

            const statsDiv = leftSide.querySelector(".category-stats");
            statsDiv.querySelector(".stat-badge").textContent =
              `${visibleItems} elementer`;

            // Auto-expand category when search matches inside it
            if (searchFilter && visibleItems > 0) {
              const content =
                categoryElement.querySelector(".category-content");
              const catHeader =
                categoryElement.querySelector(".category-header");
              if (content) content.classList.add("expanded");
              if (catHeader) catHeader.classList.add("expanded");
            }

            // Hide category if no visible items
            if (visibleItems === 0) {
              showCategory = false;
            }
          }

          categoryElement.style.display = showCategory ? "block" : "none";
        });
      }

      function applyExpandMode() {
        const expandMode = document.getElementById("expandModeFilter").value;
        const allItems = document.querySelectorAll(".item-row");

        // Update expand mode visual state
        updateExpandModeVisualState();

        allItems.forEach((item) => {
          const details = item.querySelector(".item-details");
          const header = item.querySelector(".item-header");
          const status = item.dataset.status;
          const subDetails = item.querySelectorAll(".subcheckpoint-details");
          const subHeaders = item.querySelectorAll(".subcheckpoint-header");
          const subRows = item.querySelectorAll(".subcheckpoint-row");

          switch (expandMode) {
            case "expanded":
              details.classList.add("expanded");
              header.classList.add("expanded");
              subDetails.forEach((d) => d.classList.add("expanded"));
              subHeaders.forEach((h) => h.classList.add("expanded"));
              break;
            case "collapsed":
              details.classList.remove("expanded");
              header.classList.remove("expanded");
              subDetails.forEach((d) => d.classList.remove("expanded"));
              subHeaders.forEach((h) => h.classList.remove("expanded"));
              break;
            case "issues-only":
              if (
                status === "different" ||
                status === "prodOnly" ||
                status === "testOnly"
              ) {
                details.classList.add("expanded");
                header.classList.add("expanded");
              } else {
                details.classList.remove("expanded");
                header.classList.remove("expanded");
              }
              subRows.forEach((sub) => {
                const subStatus = sub.dataset.status;
                const sd = sub.querySelector(".subcheckpoint-details");
                const sh = sub.querySelector(".subcheckpoint-header");
                if (
                  subStatus === "different" ||
                  subStatus === "prodOnly" ||
                  subStatus === "testOnly"
                ) {
                  sd.classList.add("expanded");
                  sh.classList.add("expanded");
                } else {
                  sd.classList.remove("expanded");
                  sh.classList.remove("expanded");
                }
              });
              break;
          }
        });
      }

      function updateFilterVisualStates() {
        const filters = [
          { id: "categoryFilter", groupId: "categoryFilterGroup" },
          { id: "statusFilter", groupId: "statusFilterGroup" },
          { id: "searchFilter", groupId: "searchFilterGroup" },
          {
            id: "fieldDifferenceFilter",
            groupId: "fieldDifferenceFilterGroup",
          },
        ];

        const activeFilters = [];

        filters.forEach((filter) => {
          const element = document.getElementById(filter.id);
          const group = document.getElementById(filter.groupId);
          const value = element.value.trim();

          if (value) {
            group.classList.add("active");

            // Add to active filters list
            let displayValue = value;
            if (element.tagName === "SELECT") {
              const selectedOption = element.options[element.selectedIndex];
              displayValue = selectedOption.textContent;
            }

            activeFilters.push({
              label: element.previousElementSibling.textContent.replace(
                ":",
                "",
              ),
              value: displayValue,
              filterId: filter.id,
            });
          } else {
            group.classList.remove("active");
          }
        });

        updateActiveFiltersDisplay(activeFilters);
      }

      function updateExpandModeVisualState() {
        const expandModeGroup = document.getElementById(
          "expandModeFilterGroup",
        );
        const expandMode = document.getElementById("expandModeFilter").value;

        if (expandMode === "collapsed") {
          expandModeGroup.classList.remove("active");
        } else {
          expandModeGroup.classList.add("active");
        }
      }

      function updateActiveFiltersDisplay(activeFilters) {
        const display = document.getElementById("activeFiltersDisplay");
        const tagsContainer = document.getElementById("activeFilterTags");

        if (activeFilters.length > 0) {
          display.style.display = "block";

          tagsContainer.innerHTML = "";
          activeFilters.forEach((filter) => {
            const tag = document.createElement("span");
            tag.className = "filter-tag";
            tag.textContent = `${filter.label}: ${filter.value}`;
            tag.title = "Klikk for å fjerne dette filteret";
            tag.onclick = () => clearSingleFilter(filter.filterId);
            tagsContainer.appendChild(tag);
          });
        } else {
          display.style.display = "none";
        }
      }

      function clearSingleFilter(filterId) {
        const element = document.getElementById(filterId);
        if (element.tagName === "INPUT") {
          element.value = "";
        } else {
          element.selectedIndex = 0;
        }
        applyFilters();
      }

      function clearAllFilters() {
        document.getElementById("categoryFilter").selectedIndex = 0;
        document.getElementById("statusFilter").selectedIndex = 0;
        document.getElementById("searchFilter").value = "";
        document.getElementById("fieldDifferenceFilter").selectedIndex = 0;
        document.getElementById("expandModeFilter").selectedIndex = 0;

        applyFilters();
        applyExpandMode();
      }

      function exportDifferences() {
        if (!comparisonData) return;

        const differences = [];

        Object.keys(comparisonData.categories).forEach((category) => {
          const categoryData = comparisonData.categories[category];

          Object.values(categoryData.items).forEach((item) => {
            if (item.status !== "identical") {
              differences.push({
                category: category,
                id: item.id,
                status: item.status,
                differences: item.differences,
              });
            }
          });
        });

        const data = {
          timestamp: new Date().toISOString(),
          summary: comparisonData.summary,
          differences: differences,
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `sjekkliste-api-diff-${new Date().toISOString().split("T")[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
    </script>
  </body>
</html>
